# A work issue: one package for one worker, its title a name under the name rule and its branch
# that name. It extends the ticket template; scripts/templates.py's docstring owns this file's format.
name = "work"
reader = "fleet"
extends = "ticket"
says = "One package for one worker: the ticket's why, then numbered requirements and acceptance."
remove = ["steps", "check", "depends_on"]
order = ["title", "situation", "problem", "goal", "approach", "base_branch", "reproduction",
         "package_kind", "blocked_by", "user_requirement", "design_owner", "requirements",
         "changes_after_filing", "file_ownership", "acceptance", "owner_step", "verification"]

[applies]
actions = ["issue.create", "issue.edit"]
order = 20
labels = ["work"]

[rules]
terms = "off"
bare-number = "off"
first-sentence = "warn"

[[fields]]
name = "title"
kind = "line"
source = "title"
required = true
shape = "work_tickets:name_refusal"
says = "The name, its branch too: 1 to 5 lowercase words joined by dashes, such as `branch-cleanup-on-pr-close`."

[[fields]]
name = "goal"
kind = "text"
heading = "Goal"
required = true
max_words = 120
first_sentence_chars = 120
says = "What is true once this is done, the outcome a person sees. Its first sentence, one complete statement of at most 120 characters, becomes the landing title."

[[fields]]
name = "base_branch"
kind = "line"
heading = "Base branch"
says = "The branch the work starts from, where it is not the integration branch."

[[fields]]
name = "reproduction"
kind = "text"
heading = "Reproduction"
says = "For a finding from a field report: the report linked, the command and its output verbatim."

[[fields]]
name = "package_kind"
kind = "choice"
heading = "Package kind"
choices = ["standard", "discovery", "breaking", "patch", "minor", "major",
           "work_tickets:RELEASE_KINDS"]
says = "standard, discovery (read-only research), breaking (a major release), or a kind of work, as `route --type` takes it."

[[fields]]
name = "blocked_by"
kind = "issue"
heading = "Blocked by"
exact_heading = true
required = true
none_ok = true
says = "The issues that must be closed first, one `#n` or link per line, or None."

[[fields]]
name = "user_requirement"
kind = "text"
heading = "User requirement (verbatim)"
verbatim = true
says = "The user's words, quoted exactly."

[[fields]]
name = "design_owner"
kind = "text"
heading = "Design owner"
says = "The files and sections that own the decided behaviour."

[[fields]]
name = "requirements"
kind = "list"
heading = "Requirements"
exact_heading = true
numbered = true
required = true
says = "Numbered, checkable requirements, in the order to do them."

[[fields]]
name = "changes_after_filing"
kind = "list"
heading = "Changes after filing"
numbered = true
continue_numbers = true
markers = true
says = "Requirements added after filing, numbered after the last; review open points keep their markers."

[[fields]]
name = "file_ownership"
kind = "text"
heading = "File ownership"
says = "Where parallel packages share files: who owns each shared file."

[[fields]]
name = "acceptance"
kind = "checklist"
heading = "Acceptance"
required = true
says = "Checkable items with the evidence expected."

[[fields]]
name = "owner_step"
kind = "list"
heading = "Owner step"
says = "Steps only the owner takes, one item each."

[[fields]]
name = "verification"
kind = "code"
heading = "Verification"
required = true
says = "The focused tests and real commands to run."

[example]
title = "plain-titles"

[example.fields]
title = "plain-titles"
situation = "Issues are titled by their branch name."
problem = "The owner cannot tell from the list what an issue changes."
goal = "Every issue title says in plain words what changes."
approach = "SE writes the title from the Goal.\nNot picked: a separate summary field, because the title is what the list shows."
package_kind = "standard"
blocked_by = ["None"]
user_requirement = "> Titles I can read."
requirements = ["`file` writes the plain title.", "`route` keeps it."]
acceptance = [{ done = false, text = "A test files an issue and reads its title." }]
verification = "uv run pytest -q tests/test_issue_creation.py"
