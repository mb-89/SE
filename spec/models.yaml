# The model each of SE's agents runs, set here and nowhere else. Each agent's
# front matter (src/plugin/agents/<name>.md) names the same model, which the
# rule agents holds to this file. The routine's boxes run coordinator, the
# floor for every agent; reviewer is never weaker: a stronger model where one
# is available. No API the fleet has reads the routine, so the owner sets its
# model there by hand, as coordinator says (src/internal/issues/fleet.yaml,
# principle 23).
worker: opus
coordinator: opus
reviewer: opus
retro: opus
overhaul: opus
