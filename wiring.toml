# SE as an application on kern: the core the `se` binary serves in this checkout (bootstrap.sh
# starts it, SE's docs/go-core.md "How the binary arrives") places and carries every one of SE's
# components. SE's command groups are Python, placed in a process each (README "Commands as
# components"); SE's fleet, retro-due and origin are Go, compiled into the `se` binary with kern's
# GitHub component (components/README.md). The `se` binary carries the Go ones, so this wiring may
# name them; the bare `kern` could not, which is why they lived in components/wiring.toml until SE's
# start served `se`.

# SE's command groups, components/<name>/, each a placed Python process.
[instances.tickets]
component = "tickets"
command = ["uv", "run", "--no-project", "--python", ">=3.11", "python", "scripts/se_components.py", "run", "tickets"]

[instances.issues]
component = "issues"
command = ["uv", "run", "--no-project", "--python", ">=3.11", "python", "scripts/se_components.py", "run", "issues"]

[instances.delivery]
component = "delivery"
command = ["uv", "run", "--no-project", "--python", ">=3.11", "python", "scripts/se_components.py", "run", "delivery"]

[instances.integration]
component = "integration"
command = ["uv", "run", "--no-project", "--python", ">=3.11", "python", "scripts/se_components.py", "run", "integration"]

[instances.review]
component = "review"
command = ["uv", "run", "--no-project", "--python", ">=3.11", "python", "scripts/se_components.py", "run", "review"]

[instances.retro]
component = "retro"
command = ["uv", "run", "--no-project", "--python", ">=3.11", "python", "scripts/se_components.py", "run", "retro"]

[instances.overhaul]
component = "overhaul"
command = ["uv", "run", "--no-project", "--python", ">=3.11", "python", "scripts/se_components.py", "run", "overhaul"]

[instances.render]
component = "render"
command = ["uv", "run", "--no-project", "--python", ">=3.11", "python", "scripts/se_components.py", "run", "render"]

[instances.scaffold]
component = "scaffold"
command = ["uv", "run", "--no-project", "--python", ">=3.11", "python", "scripts/se_components.py", "run", "scaffold"]
# kern's GitHub component, and SE's fleet, retro-due and origin reading it (components/README.md), all
# compiled into the `se` binary. The config is SE's own checkout's: the fleet's lease hours, the
# repository name and the integration branch; retro-due's due-after and overhaul-after counts and tracker.
[instances.github]
component = "github"

[instances.origin]
component = "origin"

[instances.fleet]
component = "fleet"
config = { lease-hours = 3.0, repository = "SE", base = "main" }

[instances.retro-due]
component = "retro-due"
config = { due-after = 10, overhaul-after = 3, tracker = "mb-89/SE", base = "main" }

[wires]
"github.issues" = "github/issues/<key>"
"github.pulls" = "github/pulls/<key>"
"github.comments" = "github/comments/<key>"
"github.checks" = "github/checks/<key>"
"github.outbox" = "github/outbox/<key>"
"github.issue-lists" = "github/issue-lists/<key>"
"github.pull-lists" = "github/pull-lists/<key>"
"fleet.issues" = "github/issues/<key>"
"fleet.pulls" = "github/pulls/<key>"
"fleet.issue-lists" = "github/issue-lists/<key>"
"fleet.pull-lists" = "github/pull-lists/<key>"
"fleet.checks" = "github/checks/<key>"
"fleet.branches" = "origin/branches"
"retro-due.issues" = "github/issues/<key>"
"retro-due.pulls" = "github/pulls/<key>"
# The streamed commands' GitHub steps (README "Hand-offs through the relay").
"integration.step" = "github.step"
"issues.step" = "github.step"

# The Stop hooks (README "Stop hook"): the delivery component's stop-check answers them inside the
# hook, in its own warm process; scripts/se_hook.sh falls back to running it directly.
[hooks]
Stop = "work_tickets.py stop-check"
SubagentStop = "work_tickets.py stop-check"
