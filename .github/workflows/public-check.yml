# The public check's commit gate on every push to the integration branch, the owner's direct pushes
# included (AGENTS.md "Public safety"). Make this check required in the branch protection of se and
# main, so a push the hooks did not see still fails here.
name: public-check

on:
  push:
    branches: [se, main]

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gate the pushed commits
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
        run: |
          # The pushed commits: those after the branch's old tip, as the pre-push hook takes them;
          # where that tip is unknown (a new branch, a force push), those no other branch holds.
          if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..$AFTER"
          else
            others=$(git for-each-ref --format='%(refname)' refs/remotes/origin |
              grep -vx -e "refs/remotes/origin/$BRANCH" -e refs/remotes/origin/HEAD | tr '\n' ' ')
            range="$AFTER --not $others"
          fi
          echo "public-check: gating $range, the commits pushed to $BRANCH"
          if ! python3 scripts/public_check.py --rev "$AFTER" --range "$range"; then
            echo "::error::public-check (scripts/public_check.py, AGENTS.md 'Public safety') refused this push to $BRANCH: amend each named commit as its line says (for a Co-authored-by line, without the line, and turn off the editor's co-author setting, README 'Install'), then push again"
            exit 1
          fi
