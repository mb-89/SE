# SE's CI, the one check main's ruleset requires by its name `check` (AGENTS.md "Public safety"):
# on every pull request and every push to the integration branch, the public check's commit gate
# and then the complete suite. The job passes only when both pass, so a push or pull request the
# hooks did not see still fails here.
name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gate the commits
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.pull_request.head.sha || github.sha }}
          BRANCH: ${{ github.event.pull_request.base.ref || github.ref_name }}
        run: |
          # A pull request: its commits, those its head holds and its base branch does not. A push:
          # the commits after the branch's old tip, as the pre-push hook takes them; where that tip
          # is unknown (a new branch, a force push), those no other branch holds.
          if [ -n "$BASE_REF" ]; then
            range="refs/remotes/origin/$BASE_REF..$AFTER"
            what="the commits of the pull request into $BRANCH"
          elif git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..$AFTER"
            what="the commits pushed to $BRANCH"
          else
            others=$(git for-each-ref --format='%(refname)' refs/remotes/origin |
              grep -vx -e "refs/remotes/origin/$BRANCH" -e refs/remotes/origin/HEAD | tr '\n' ' ')
            range="$AFTER --not $others"
            what="the commits pushed to $BRANCH"
          fi
          echo "public-check: gating $range, $what"
          if ! python3 scripts/public_check.py --rev "$AFTER" --range "$range"; then
            echo "::error::public-check (scripts/public_check.py, AGENTS.md 'Public safety') refused $what: amend each named commit as its line says (for a Co-authored-by line, without the line, and turn off the editor's co-author setting, README 'Install'), then push again"
            exit 1
          fi
      - uses: astral-sh/setup-uv@v6
      - name: Run the complete suite
        run: uv run pytest -q
