# SE's CI, the one check main's ruleset requires by its name `check` (AGENTS.md "Public safety"):
# on every pull request and every push to the integration branch, every check the integration runs:
# the public check's commit gate, the generated layouts, the README's command reference, a pull
# request's field report and the complete suite within its budget, kern's tests on Linux and,
# through the job kern-platforms, on Windows and macOS with SE's start and hook scripts; on a pull
# request also the work model's issue rule.
# The job passes only when all pass, so a push or pull request the hooks did not see still fails
# here. Where se.toml [tests] trust_integrator is on, the job trust passes it on the integrator's
# record of exactly the tree checked out, and the suite, kern's checks and kern-platforms do not run;
# a nightly run is the safety net (README "Trusted landings"). SE keeps it off: everything runs.
name: check

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
  push:
    branches: [main]
  # The safety net of trusted landings: main's full suite every night.
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read
  issues: read
  # The trust job reads the integrator's record and its run; a full pass marks its commit.
  checks: write
  actions: read

jobs:
  check:
    needs: [trust, kern-platforms]
    # It runs whatever kern-platforms answered, and its last step fails unless that passed (or was
    # skipped for a trusted landing): a required check that is skipped would count as passed.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Gate the commits
        # A scheduled run gates nothing new: its commits were gated when they were pushed.
        if: github.event_name != 'schedule'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.pull_request.head.sha || github.sha }}
          BRANCH: ${{ github.event.pull_request.base.ref || github.ref_name }}
        run: |
          # A pull request: its commits, those its head holds and its base branch does not. A push:
          # the commits after the branch's old tip, as the pre-push hook takes them; where that tip
          # is unknown (a new branch, a force push), those no other branch holds.
          if [ -n "$BASE_REF" ]; then
            range="refs/remotes/origin/$BASE_REF..$AFTER"
            what="the commits of the pull request into $BRANCH"
          elif git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..$AFTER"
            what="the commits pushed to $BRANCH"
          else
            others=$(git for-each-ref --format='%(refname)' refs/remotes/origin |
              grep -vx -e "refs/remotes/origin/$BRANCH" -e refs/remotes/origin/HEAD | tr '\n' ' ')
            range="$AFTER --not $others"
            what="the commits pushed to $BRANCH"
          fi
          echo "public-check: gating $range, $what"
          if ! python3 scripts/public_check.py --rev "$AFTER" --range "$range"; then
            echo "::error::public-check (scripts/public_check.py, AGENTS.md 'Public safety') refused $what: amend each named commit as its line says (for a Co-authored-by line, without the line, and turn off the editor's co-author setting, README 'Install'), then push again"
            exit 1
          fi
      # The work model's issue rule (src/skills/work-model/SKILL.md "Integration branch"): the
      # description names an open work issue, a landing's through the work pull request it lands.
      - name: The pull request names an open work issue
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/pr_issues.py
      - uses: astral-sh/setup-uv@v7
      # Before the suite, whose start regenerates the layouts (tests/conftest.py).
      - name: The generated layouts match src/
        run: uv run python scripts/se_plugin.py check
      - name: The README's command reference is up to date
        run: uv run python scripts/work_tickets.py docs --check
      - name: The pull request's field report follows the template
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          # A worker's pull request carries its field report; it is checked against its work issue,
          # the issue its first line `Fixes|Refs <issue url>` names. A pull request without the
          # report's marker (a switch pull request) has none to check. A landing pull request
          # carries `<!-- se:field-report-in <n> -->` instead: the report is the description of the
          # work pull request <n>, read from there (README "Landing on main").
          body="$RUNNER_TEMP/pr-body.md"
          printf '%s\n' "$PR_BODY" > "$body"
          work=$(sed -nE 's#^<!-- se:field-report-in ([0-9]+) -->[[:space:]]*$#\1#p' "$body" | head -n 1)
          if [ -n "$work" ]; then
            echo "field-report: the landing's report is the description of pull request $work"
            gh api "repos/$REPOSITORY/pulls/$work" --jq .body > "$body"
          fi
          if ! grep -q '<!-- se:field-report -->' "$body"; then
            echo "field-report: no field report in the description, nothing to check"
            exit 0
          fi
          # pr_issues.py owns how a description names its issue, for this step and the one above.
          if ! issue=$(python3 scripts/pr_issues.py --work-issue "$body" --repository "$REPOSITORY"); then
            echo "::error::field-report: the description's first line names no work issue of $REPOSITORY (Fixes|Refs <issue url>, as work_tickets.py pr-body writes it, or Refs #<n>)"
            exit 1
          fi
          gh api "repos/$REPOSITORY/issues/$issue" --jq .body > "$RUNNER_TEMP/issue-body.md"
          uv run python scripts/work_tickets.py field-report --check "$body" --issue-body "$RUNNER_TEMP/issue-body.md"
      # kern, the Go core incubated under kern/ (kern/README.md "Tests"), on the Go its go.mod
      # pins: vetted here; its tests run in the suite step below, as se.toml [tests.beside.kern]
      # declares them, with their own time and budget.
      - if: needs.trust.outputs.trusted != 'true'
        uses: actions/setup-go@v6
        with:
          go-version-file: kern/go.mod
          cache-dependency-path: kern/go.sum
      - name: kern vets
        if: needs.trust.outputs.trusted != 'true'
        working-directory: kern
        run: time go vet ./...
      # gofmt -l lists each file of kern's not formatted as gofmt writes it; any fails the check.
      - name: kern is formatted
        if: needs.trust.outputs.trusted != 'true'
        working-directory: kern
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt -l lists files of kern not formatted: $(echo $unformatted); run gofmt -w . in kern"
            exit 1
          fi
      # SE's Go components (components/README.md "Tests"), their module beside kern's: vetted
      # here; their tests run in the suite step below, as se.toml [tests.beside.go-components] declares.
      - name: SE's Go components vet
        if: needs.trust.outputs.trusted != 'true'
        working-directory: components
        run: time go vet ./...
      # The budget's reference run (README "Test budget"): over a limit here, check fails.
      - name: The complete suite and kern's tests, within their budgets
        if: needs.trust.outputs.trusted != 'true'
        run: uv run python scripts/work_tickets.py suite --worktree .
      - name: kern and SE's start and hook passed on Windows and macOS
        env:
          PLATFORMS: ${{ needs.kern-platforms.result }}
          TRUSTED: ${{ needs.trust.outputs.trusted }}
        run: |
          if [ "$TRUSTED" = true ] && [ "$PLATFORMS" = skipped ]; then
            echo "kern-platforms did not run: the integrator's record of this tree is trusted"
          elif [ "$PLATFORMS" != success ]; then
            echo "::error::kern-platforms answered $PLATFORMS: kern's tests and SE's start and hook tests on Windows and macOS (the job kern-platforms of this run) must pass"
            exit 1
          fi
      # The safety net's bookkeeping, where trust_integrator is on (else they do nothing): a full
      # pass marks its commit; a failed full run names the trusted records since the last one.
      - name: Mark the full pass
        if: success() && needs.trust.outputs.trusted != 'true'
        uses: ./.github/actions/integrator-pass
        with:
          mode: full-pass
      - name: Name the trusted records the failure came through
        if: failure() && needs.trust.outputs.trusted != 'true'
        uses: ./.github/actions/integrator-pass
        with:
          mode: finding
  # kern's tests on Windows and macOS, its contract suite among them (kern/README.md "Tests"): the
  # detached start, the standing file and the stop differ there; and the tests of SE's start and
  # hook scripts, whose paths differ there too (a zip on Windows, shasum and no setsid on macOS).
  # `check` needs it and fails unless every platform passed, so the one required check covers it;
  # the Python suite and its budget stay on Linux, so this job runs the command of se.toml
  # [tests.beside.kern] itself.
  kern-platforms:
    needs: trust
    if: needs.trust.outputs.trusted != 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: kern/go.mod
          cache-dependency-path: kern/go.sum
      # The contract suite's real leg runs its fixture component in Python 3.11 or later
      # (kern/contract/real_test.go); on Linux the suite step's uv environment gives it.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: kern vets
        working-directory: kern
        run: go vet ./...
      - name: kern's tests pass, its contract suite among them
        working-directory: kern
        run: go test ./...
      # The hook test that once bounded runner speed (kern/host/host_test.go), repeated where it
      # flaked; a second or less.
      - name: A hook with no core fails open at once, 200 runs of 200
        working-directory: kern
        run: go test -count=200 -run 'TestAHookWithNoCoreFailsOpenAtOnce$' ./host/
      - uses: astral-sh/setup-uv@v7
      # Git's bash on Windows, as a session runs these scripts there.
      - name: SE's start and hook scripts on this platform
        shell: bash
        run: uv run pytest -q tests/test_bootstrap.py tests/test_se_hook.py
  # Whether this run passes on the integrator's record of exactly this tree instead of running the
  # suite (README "Trusted landings"): only where se.toml [tests] trust_integrator is on, never on
  # the safety net's runs. Its full history counts the landings for se.toml [tests] full_every.
  trust:
    runs-on: ubuntu-26.04
    outputs:
      trusted: ${{ steps.lookup.outputs.trusted }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: lookup
        uses: ./.github/actions/integrator-pass
        with:
          mode: lookup
