# SE's CI, the one check main's ruleset requires by its name `check` (AGENTS.md "Public safety"):
# on every pull request and every push to the integration branch, every check the integration runs:
# the public check's commit gate, the generated layouts, the README's command reference, the
# hygiene of SE's own checkout, a pull request's field report and the complete suite within its
# budget, SE's Go components on kern at the pin se.toml [modules.kern] reads from components/go.mod,
# and, through the job kern-platforms, SE's start, hook and setup scripts and its worktree removal
# tests on Windows (darwin is built by the release, not tested); on a pull request also the work
# model's issue rule. kern's own tests run in kern's repository, in its check.
# The job passes only when all pass, so a push or pull request the hooks did not see still fails
# here. Where se.toml [tests] trust_integrator is on, the job trust passes it on the integrator's
# record of exactly the tree checked out, and the suite, the Go checks and kern-platforms do not run;
# a nightly run is the safety net (README "Trusted landings"). SE keeps it off: everything runs.
# A pull request's edit or label change (edited, labeled, unlabeled) checks the field report and the
# issue rule again and takes the result of the suite, the Go checks and kern-platforms from the
# newest completed run for the same head that ran them on the same tree and Component kinds, naming
# that run; a failed result stays failed, and where there is none, or the newest completed run was
# cancelled, or the run is a re-run, everything runs (scripts/ci_reuse.py, README "Edits reuse the
# suite"). Every other event runs everything, as always.
name: check

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
  push:
    branches: [main]
  # The safety net of trusted landings: main's full suite every night.
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read
  issues: read
  # The trust job reads the integrator's record and its run; a full pass marks its commit.
  checks: write
  actions: read

jobs:
  check:
    needs: [trust, kern-platforms]
    # It runs whatever kern-platforms answered, and its last step fails unless that passed (or was
    # skipped for a trusted landing): a required check that is skipped would count as passed.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Gate the commits
        # A scheduled run gates nothing new: its commits were gated when they were pushed.
        if: github.event_name != 'schedule'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.pull_request.head.sha || github.sha }}
          BRANCH: ${{ github.event.pull_request.base.ref || github.ref_name }}
          DEFAULT: ${{ github.event.repository.default_branch }}
        run: |
          # A pull request: its commits, those its head holds and its base branch does not, and the
          # tree of the checked-out merge of its head into its base, the tree its landing lands,
          # judged by that tree's allow list. A push: the pushed tree and the commits
          # public_check.py's push_range takes. To the integration branch, those after its old tip,
          # or where that tip is unknown those no other branch holds, gated whole. To a work branch,
          # where the integration branch is the default branch and origin's ref for it exists,
          # those after its old tip, or all its commits where that tip is unknown, without those
          # the integration branch holds; otherwise as to the integration branch. Its git goes
          # through se's git door (scripts/git_door.py).
          refused="::error::public-check (scripts/public_check.py, AGENTS.md 'Public safety') refused the commits it names: amend each named commit as its line says (for a Co-authored-by line, without the line, and turn off the editor's co-author setting, README 'Install'), then push again"
          if [ -n "$BASE_REF" ]; then
            range="refs/remotes/origin/$BASE_REF..$AFTER"
            echo "public-check: gating $range, the commits of the pull request into $BRANCH"
            if ! python3 scripts/public_check.py --rev HEAD --range "$range"; then
              echo "$refused"; exit 1
            fi
          elif ! python3 scripts/public_check.py --rev "$AFTER" --push "$BEFORE" --branch "$BRANCH" --default-branch "$DEFAULT"; then
            echo "$refused"; exit 1
          fi
      # The work model's issue rule (src/skills/work-model/SKILL.md "Integration branch"): the
      # description names an open work issue, a landing's through the work pull request it lands.
      - name: The pull request names an open work issue
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/pr_issues.py
      - uses: astral-sh/setup-uv@v7
      # kern at the version components/go.mod requires (se.toml [modules.kern], README "Modules"),
      # in .se/modules/kern, which go.mod's replace names; a committed se.lock that lags the require
      # fails here. First, as the command reference (kern's SDK) and the suite read it.
      - name: kern at the pin components/go.mod requires
        run: |
          uv run python scripts/se_modules.py sync kern
          if ! git diff --exit-code -- se.lock; then
            echo "::error::se.lock does not lock the kern components/go.mod requires: run uv run python scripts/se_modules.py sync kern and commit se.lock"
            exit 1
          fi
      # Before the suite, whose start regenerates the layouts (tests/conftest.py).
      - name: The generated layouts match src/
        run: uv run python scripts/se_plugin.py check
      - name: The README's command reference is up to date
        run: uv run python scripts/work_tickets.py docs --check
      # The checks of SE's own checkout, not of its code, through git's real door (scripts/hygiene.py,
      # AGENTS.md "Tests"): tracked files, the git door, dangling references and the public check
      # with SE's line of history; a trusted landing runs them too, as they take seconds.
      - name: SE's checkout passes its hygiene checks
        run: uv run python scripts/hygiene.py
      - name: The pull request's field report follows the template
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          # A worker's pull request carries its field report; it is checked against its work issue,
          # the issue its first line `Fixes|Refs <issue url>` names. A pull request without the
          # report's marker (a switch pull request) has none to check. A landing pull request
          # carries `<!-- se:field-report-in <n> -->` instead: the report is the description of the
          # work pull request <n>, read from there (README "Landing on main").
          body="$RUNNER_TEMP/pr-body.md"
          printf '%s\n' "$PR_BODY" > "$body"
          work=$(sed -nE 's#^<!-- se:field-report-in ([0-9]+) -->[[:space:]]*$#\1#p' "$body" | head -n 1)
          if [ -n "$work" ]; then
            echo "field-report: the landing's report is the description of pull request $work"
            gh api "repos/$REPOSITORY/pulls/$work" --jq .body > "$body"
          fi
          if ! grep -q '<!-- se:field-report -->' "$body"; then
            echo "field-report: no field report in the description, nothing to check"
            exit 0
          fi
          # pr_issues.py owns how a description names its issue, for this step and the one above.
          if ! issue=$(python3 scripts/pr_issues.py --work-issue "$body" --repository "$REPOSITORY"); then
            echo "::error::field-report: the description's first line names no work issue of $REPOSITORY (Fixes|Refs <issue url>, as work_tickets.py pr-body writes it, or Refs #<n>)"
            exit 1
          fi
          gh api "repos/$REPOSITORY/issues/$issue" --jq .body > "$RUNNER_TEMP/issue-body.md"
          # A work pull request's Component kinds reach the suite's release guard, which passes a
          # changed component of a stated kind, as the landing assigns its version (README
          # "Component versions"); a landing's release commit carries the versions, so it sets none.
          kinds=()
          if [ -z "$work" ]; then kinds=(--component-kinds-to "$GITHUB_ENV"); fi
          uv run python scripts/work_tickets.py field-report --check "$body" --issue-body "$RUNNER_TEMP/issue-body.md" "${kinds[@]}"
      # The changed files a form claims (README "Forms"): the command reads se.toml [forms] files
      # at origin/<integration branch> itself and passes where it is off.
      - name: The changed files a form claims follow their forms
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: uv run python scripts/se_forms.py check-files --changed "origin/$BASE_REF"
      # SE's Go components, on the Go their go.mod pins.
      - if: needs.trust.outputs.suite == 'run'
        uses: actions/setup-go@v6
        with:
          go-version-file: components/go.mod
          cache-dependency-path: components/go.sum
      # SE's Go components (components/README.md "Tests"), on kern at its pin: vetted here; their
      # tests run in the suite step below, as se.toml [tests.beside.go-components] declares.
      - name: SE's Go components vet
        if: needs.trust.outputs.suite == 'run'
        working-directory: components
        run: time go vet ./...
      # The budget's reference run (README "Test budget"): over a limit here, check fails. The
      # nightly run is full: it runs every suite beside, also one whose paths the change does not
      # touch.
      # The suite's docs and deck builds run through obs's adapter component html (README
      # "Documentation"), installed first.
      - name: Install obs's adapter component html
        if: needs.trust.outputs.suite == 'run'
        run: uv run python scripts/build_docs.py --install-html
      - name: The complete suite and the suites beside it, within their budgets
        if: needs.trust.outputs.suite == 'run'
        env:
          EVENT: ${{ github.event_name }}
        run: |
          full=()
          if [ "$EVENT" = schedule ]; then full=(--full); fi
          uv run python scripts/work_tickets.py suite --worktree . "${full[@]}" --record-file-seconds "$RUNNER_TEMP/file-seconds.json" --keep-test-reports "$RUNNER_TEMP/test-reports"
      # The seconds each test file took in this run, the PowerShell cases among them: the run's
      # artifact file-seconds, from which `work_tickets.py file-seconds` writes tests/file-seconds.json.
      - name: Keep the suite's file seconds
        if: success() && needs.trust.outputs.suite == 'run'
        uses: actions/upload-artifact@v7
        with:
          name: file-seconds
          path: ${{ runner.temp }}/file-seconds.json
          if-no-files-found: error
      # The suite's JUnit reports, also from a failed run: se.xml holds every test's seconds, setup
      # time, worker and start, and the runner's cpu; `work_tickets.py test-seconds` reads them.
      - name: Keep the suite's test reports
        if: ${{ !cancelled() && needs.trust.outputs.suite == 'run' }}
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: ${{ runner.temp }}/test-reports
          if-no-files-found: ignore
      # An edit or label change that took an earlier run's result (the job trust's decision,
      # scripts/ci_reuse.py): passes or fails as that run did, naming it.
      - name: The suite, the Go checks and kern-platforms of an earlier run of this tree
        if: needs.trust.outputs.suite == 'reused'
        env:
          SOURCE: ${{ needs.trust.outputs.source }}
          RESULT: ${{ needs.trust.outputs.result }}
          WHY: ${{ needs.trust.outputs.why }}
        run: |
          if [ "$RESULT" = success ]; then
            echo "::notice title=se reused check::the suite, the Go checks and kern-platforms did not run again: $WHY ($SOURCE)"
          else
            echo "::error title=se reused check::$WHY ($SOURCE): push the fix, or re-run all jobs of this run, which runs everything"
            exit 1
          fi
      - name: SE's start, hook and setup scripts passed on Windows
        env:
          PLATFORMS: ${{ needs.kern-platforms.result }}
          SUITE: ${{ needs.trust.outputs.suite }}
        run: |
          if [ "$SUITE" = trusted ] && [ "$PLATFORMS" = skipped ]; then
            echo "kern-platforms did not run: the integrator's record of this tree is trusted"
          elif [ "$SUITE" = reused ] && [ "$PLATFORMS" = skipped ]; then
            echo "kern-platforms did not run: its result is the earlier run's, taken in the step above"
          elif [ "$PLATFORMS" != success ]; then
            echo "::error::kern-platforms answered $PLATFORMS: SE's start, hook, setup and worktree tests on Windows (the job kern-platforms of this run) must pass"
            exit 1
          fi
      # The safety net's bookkeeping, where trust_integrator is on (else they do nothing): a full
      # pass marks its commit; a failed full run names the trusted records since the last one.
      - name: Mark the full pass
        if: success() && needs.trust.outputs.suite == 'run'
        uses: ./.github/actions/integrator-pass
        with:
          mode: full-pass
      - name: Name the trusted records the failure came through
        if: failure() && needs.trust.outputs.suite == 'run'
        uses: ./.github/actions/integrator-pass
        with:
          mode: finding
  # The tests of SE's start and hook scripts on Windows, whose paths differ there (a zip), with
  # setup.ps1, RUNME and the worktree clean-up; kern's own tests on Windows run in kern's
  # repository. The job keeps its name, which scripts/work_tickets.py PLATFORM_JOB,
  # scripts/ci_queue.py and check-rerun.yml read. No leg runs on macOS: the release cross-compiles
  # darwin on Linux, and nothing tests it there.
  # `check` needs it and fails unless every leg passed, so the one required check covers it;
  # the Python suite and its budget stay on Linux.
  kern-platforms:
    needs: trust
    if: needs.trust.outputs.suite == 'run'
    # A leg that runs is bounded here; the time it waits for a runner counts against nothing here,
    # so kern-platforms-queue bounds that (README "Platform legs and their queue").
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      # Git's bash on Windows, as a session runs these scripts there, and RUNME.sh as a person runs it.
      - name: SE's start and hook scripts on this platform
        shell: bash
        run: uv run pytest -q tests/test_bootstrap.py tests/test_se_hook.py tests/test_se_mcp.py tests/test_runme.py
      # The worktree clean-up leaves links alone, junctions only Windows has among them; -rs names each skip.
      - name: SE's worktree clean-up on this platform
        shell: bash
        run: uv run pytest -q -rs tests/test_worktree_removal.py
      # setup.ps1, the hook setup in PowerShell (tests/test_public_check.py SETUPS), with the hooks it
      # installs: only Windows has PowerShell, so only this leg runs it; none selected fails.
      - name: SE's hook setup in PowerShell
        if: runner.os == 'Windows'
        shell: bash
        run: uv run pytest -q tests/test_public_check.py -k powershell
      # RUNME.ps1, the generic pair's PowerShell half, started from PowerShell as a person starts it:
      # only Windows has PowerShell, so only this leg runs it; none selected fails.
      - name: RUNME from PowerShell
        if: runner.os == 'Windows'
        shell: powershell
        run: uv run pytest -q tests/test_runme.py -k powershell
      # scripts/bash.ps1, the hand-off to Git's bash, started from PowerShell, not from Git's bash, as a
      # PowerShell hook line starts it: only Windows has PowerShell, so only this leg runs it.
      - name: The hand-off from PowerShell to Git's bash
        if: runner.os == 'Windows'
        shell: powershell
        run: uv run pytest -q tests/test_windows_entry.py
  # The queue bound of kern-platforms (README "Platform legs and their queue"): a leg still waiting
  # for a runner after 20 minutes is reported as never run, not as a test failure, and the run is
  # cancelled; check-rerun.yml re-runs a first attempt so cancelled once.
  kern-platforms-queue:
    needs: trust
    if: needs.trust.outputs.suite == 'run'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7
      - name: Every kern-platforms leg gets a runner within 20 minutes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/ci_queue.py watch --jobs kern-platforms --queue-minutes 20
  # Whether this run runs the suite, the Go checks and kern-platforms (output suite: run), or passes
  # on the integrator's record of exactly this tree (trusted, README "Trusted landings": only where
  # se.toml [tests] trust_integrator is on, never on the safety net's runs; its full history counts
  # the landings for se.toml [tests] full_every), or, on an edit or label change, takes an earlier
  # run's result for this tree (reused, with source, result and why; README "Edits reuse the
  # suite"). The decision step is named with this run's reuse key, from which a later run reads it.
  trust:
    runs-on: ubuntu-26.04
    outputs:
      suite: ${{ steps.reuse.outputs.suite }}
      source: ${{ steps.reuse.outputs.source }}
      result: ${{ steps.reuse.outputs.result }}
      why: ${{ steps.reuse.outputs.why }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: lookup
        uses: ./.github/actions/integrator-pass
        with:
          mode: lookup
      - id: key
        name: The reuse key of this tree and its Component kinds
        run: python3 scripts/ci_reuse.py key
      - id: reuse
        name: Reuse an earlier result of this tree (reuse key ${{ steps.key.outputs.key }})
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TRUSTED: ${{ steps.lookup.outputs.trusted }}
        run: python3 scripts/ci_reuse.py decide --trusted "$TRUSTED"
