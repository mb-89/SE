# Tags each release: v<version> of every se.toml [project] version on the integration branch, and
# moves v<major> of the current version to that major's newest release (README "Release tags").
# Reusable: a repository calls it with the short file that section shows, as se does in
# release-tag.yml.
name: release

on:
  workflow_call:

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag the versions
        shell: python3 {0}
        run: |
          # Tags every version se.toml carried on the integration branch's first-parent history on
          # the first commit that carried it, where the tag is missing; an existing tag never moves. The
          # one moving tag, v<major> of the version se.toml carries, then names that major's newest release.
          import os, re, subprocess, sys, tomllib

          def git(*arguments):
              return subprocess.run(["git", *arguments], capture_output=True, text=True, check=True).stdout.strip()

          def version(commit):
              shown = subprocess.run(["git", "show", f"{commit}:se.toml"], capture_output=True, text=True)
              if shown.returncode != 0:
                  return None
              value = tomllib.loads(shown.stdout).get("project", {}).get("version")
              return value if isinstance(value, str) and re.fullmatch(r"\d+\.\d+\.\d+", value) else None

          project = tomllib.loads(open("se.toml", encoding="utf-8").read()).get("project", {})
          branch, pushed = project.get("integration_branch", "main"), os.environ["GITHUB_REF_NAME"]
          if pushed != branch:
              sys.exit(print(f"No release: {pushed} is not the integration branch {branch} (se.toml [project] integration_branch)"))
          first = {}
          for commit in git("log", "--first-parent", "--reverse", "--format=%H", "HEAD", "--", "se.toml").split():
              carried = version(commit)
              if carried is not None:
                  first.setdefault(carried, commit)
          if not first:
              sys.exit(print("No release: se.toml never carried a [project] version"))
          tagged = {}
          for line in git("for-each-ref", "--format=%(refname:strip=2) %(objectname) %(*objectname)", "refs/tags").splitlines():
              name, commit, *peeled = line.split()
              tagged[name] = peeled[0] if peeled else commit
          created = []
          for carried, commit in first.items():
              tag = f"v{carried}"
              if tagged.get(tag) == commit:
                  print(f"Release {tag}: tagged already on {commit[:7]}")
              elif tag in tagged:
                  print(f"::warning::Release {tag}: the tag names {tagged[tag][:7]}, but se.toml first carried "
                        f"{carried} on {commit[:7]}; the tag is left as it is")
              else:
                  git("tag", tag, commit)
                  tagged[tag] = commit
                  created.append(f"refs/tags/{tag}")
                  print(f"Release {tag}: tagged {commit[:7]}")
          # Only this release's major tag moves: an older major's tag was its own release's to push, so
          # a refused one (a tag ruleset) never fails a later release.
          current = version("HEAD")
          major = None if current is None else int(current.split(".")[0])
          newest = None
          for name, commit in tagged.items():
              number = re.fullmatch(r"v(\d+)\.(\d+)\.(\d+)", name)
              if number is not None and int(number.group(1)) == major:
                  release = (tuple(int(part) for part in number.groups()), name, commit)
                  newest = max(newest or release, release)
          if newest is not None:
              _, name, commit = newest
              tag = f"v{major}"
              if tagged.get(tag) == commit:
                  print(f"Release {tag}: tagged already on {commit[:7]} ({name})")
              else:
                  git("tag", "--force", tag, commit)
                  created.append(f"+refs/tags/{tag}")
                  print(f"Release {tag}: moved to {commit[:7]} ({name})")
          # Each ref on its own, so one refused ref is named and the others still land.
          refused = 0
          for ref in created:
              pushed = subprocess.run(["git", "push", "origin", ref], capture_output=True, text=True)
              if pushed.returncode != 0:
                  refused += 1
                  reason = " ".join(line.strip() for line in pushed.stderr.splitlines()
                                    if line.strip().startswith(("remote:", "!", "error:"))) or pushed.stderr.strip()
                  print(f"::error::Release: origin refused {ref.lstrip('+')} ({reason}); allow this workflow "
                        "to push it, as the repository's tag rulesets (Settings > Rules > Rulesets) decide, "
                        "then rerun this job")
          sys.exit(1 if refused else 0)
