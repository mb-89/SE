# Tags each release: v<version> of every se.toml [project] version on the integration branch (README
# "Release tags"). Reusable: a repository calls it with the short file that section shows, as se
# does in release-tag.yml.
name: release

on:
  workflow_call:

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag the versions
        shell: python3 {0}
        run: |
          # Tags every version se.toml carried on the integration branch's first-parent history on
          # the first commit that carried it, where the tag is missing; an existing tag never moves.
          import os, re, subprocess, sys, tomllib

          def git(*arguments):
              return subprocess.run(["git", *arguments], capture_output=True, text=True, check=True).stdout.strip()

          def version(commit):
              shown = subprocess.run(["git", "show", f"{commit}:se.toml"], capture_output=True, text=True)
              if shown.returncode != 0:
                  return None
              value = tomllib.loads(shown.stdout).get("project", {}).get("version")
              return value if isinstance(value, str) and re.fullmatch(r"\d+\.\d+\.\d+", value) else None

          project = tomllib.loads(open("se.toml", encoding="utf-8").read()).get("project", {})
          branch, pushed = project.get("integration_branch", "main"), os.environ["GITHUB_REF_NAME"]
          if pushed != branch:
              sys.exit(print(f"No release: {pushed} is not the integration branch {branch} (se.toml [project] integration_branch)"))
          first = {}
          for commit in git("log", "--first-parent", "--reverse", "--format=%H", "HEAD", "--", "se.toml").split():
              carried = version(commit)
              if carried is not None:
                  first.setdefault(carried, commit)
          if not first:
              sys.exit(print("No release: se.toml never carried a [project] version"))
          tagged = {}
          for line in git("for-each-ref", "--format=%(refname:strip=2) %(objectname) %(*objectname)", "refs/tags").splitlines():
              name, commit, *peeled = line.split()
              tagged[name] = peeled[0] if peeled else commit
          created = []
          for carried, commit in first.items():
              tag = f"v{carried}"
              if tagged.get(tag) == commit:
                  print(f"Release {tag}: tagged already on {commit[:7]}")
              elif tag in tagged:
                  print(f"::warning::Release {tag}: the tag names {tagged[tag][:7]}, but se.toml first carried "
                        f"{carried} on {commit[:7]}; the tag is left as it is")
              else:
                  git("tag", tag, commit)
                  created.append(tag)
                  print(f"Release {tag}: tagged {commit[:7]}")
          if created:
              git("push", "origin", *(f"refs/tags/{tag}" for tag in created))
