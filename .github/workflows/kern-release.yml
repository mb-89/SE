# kern's reusable release workflow, for an application's binary (kern's README "Release"): its core
# plus its Go components, from the folder `directory` names, for six platforms with SHA256SUMS, the
# same bytes for one commit, through kern's release tool (kern/tools/release, run from that
# folder's module), which reads the folder's release.toml. On a pull request it only builds; on a
# push to main it publishes the release that folder's release.toml names, where it does not exist
# yet, so a push that changes the version cuts its release. kern's own release runs in kern's
# repository. An application calls the copy SE writes into it (scripts/se_workflows.py, SE's docs/running.md
# "Workflows"), with
#
#   jobs:
#     release:
#       uses: ./.github/workflows/kern-release.yml
#       with:
#         directory: <the application's binary folder, e.g. components>
#
# SE's own se-release.yml does, for the `se` binary. kern is placed at the commit the checkout's
# se.lock locks (docs/modules.md "Modules") in .se/modules/kern, which the folder's go.mod replaces kern by,
# through the action kern-at-pin, as the battery places it.
name: kern-release

on:
  workflow_call:
    inputs:
      directory:
        description: The folder holding the binary's release.toml, go.mod and package
        type: string
        default: .

permissions:
  contents: read

concurrency:
  group: kern-release-${{ inputs.directory }}-${{ github.ref }}

jobs:
  build:
    runs-on: ubuntu-26.04
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
      binary: ${{ steps.plan.outputs.binary }}
    steps:
      - uses: actions/checkout@v7
      # kern at the commit the checkout's se.lock locks, which the folder's go.mod replaces kern
      # by: the one action the battery calls too (kern-at-pin), whose copy SE writes beside this
      # workflow's (scripts/se_workflows.py).
      - name: kern at the pin
        uses: ./.github/actions/kern-at-pin
      - uses: actions/setup-go@v6
        with:
          go-version-file: ${{ inputs.directory }}/go.mod
          cache-dependency-path: ${{ inputs.directory }}/go.sum
      # The release tool runs from the binary's folder, whose module requires kern; it refuses
      # where that folder's release.toml URL names another repository than this one.
      - name: The release the folder names
        id: plan
        working-directory: ${{ inputs.directory }}
        run: go run kern/tools/release plan --dir . --repository "$GITHUB_REPOSITORY" | tee -a "$GITHUB_OUTPUT"
      - name: Six binaries and SHA256SUMS
        working-directory: ${{ inputs.directory }}
        run: |
          go run kern/tools/release build --dir . --out "$RUNNER_TEMP/dist"
          ls -l "$RUNNER_TEMP/dist"
          cat "$RUNNER_TEMP/dist/SHA256SUMS"
          (cd "$RUNNER_TEMP/dist" && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.plan.outputs.binary }}-${{ steps.plan.outputs.version }}
          path: ${{ runner.temp }}/dist/
          if-no-files-found: error

  publish:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: ${{ needs.build.outputs.binary }}-${{ needs.build.outputs.version }}
          path: dist
      - name: Publish the release where it is missing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          VERSION: ${{ needs.build.outputs.version }}
          BINARY: ${{ needs.build.outputs.binary }}
        run: |
          # A release that exists is never changed: a change without a new version releases nothing.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "kern-release: $TAG is released already; change the folder's release.toml version to cut the next"
            exit 0
          fi
          notes="$BINARY $VERSION, for linux, darwin and windows on amd64 and arm64. Verify with sha256sum -c SHA256SUMS (kern's README \"Release\")."
          if ! gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "$BINARY $VERSION" --notes "$notes" dist/*; then
            echo "::error::kern-release: GitHub refused release $TAG on $GITHUB_SHA; where a tag ruleset refuses this tag scheme, allow this workflow to create it (Settings > Rules > Rulesets), then run this workflow on main again"
            exit 1
          fi
          echo "kern-release: published $TAG on $GITHUB_SHA"
