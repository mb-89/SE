# kern's release (kern/README.md "Release"). On every pull request and push to main that touches kern
# it builds the bare core for six platforms with SHA256SUMS, and runs the bare application's battery
# (kern/template); on main it then publishes them as the release kern/release.toml names, where that
# release does not exist yet, so a push that changes kern's version cuts its release. While kern is
# incubated in SE, the release is SE's, tagged kern-v<version>.
name: kern-release

on:
  pull_request:
    paths: ["kern/**", ".github/workflows/kern-release.yml", ".github/workflows/kern-battery.yml"]
  push:
    branches: [main]
    paths: ["kern/**", ".github/workflows/kern-release.yml", ".github/workflows/kern-battery.yml"]
  # A rerun of the publication, for example after a refused tag was allowed.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kern-release-${{ github.ref }}

jobs:
  build:
    runs-on: ubuntu-26.04
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: kern/go.mod
          cache-dependency-path: kern/go.sum
      # Refuses where release.toml's URL names another repository than this one.
      - name: The release kern/release.toml names
        id: plan
        working-directory: kern
        run: go run ./tools/release plan --repository "$GITHUB_REPOSITORY" | tee -a "$GITHUB_OUTPUT"
      - name: Six binaries and SHA256SUMS
        working-directory: kern
        run: |
          go run ./tools/release build --out "$RUNNER_TEMP/dist"
          ls -l "$RUNNER_TEMP/dist"
          cat "$RUNNER_TEMP/dist/SHA256SUMS"
          (cd "$RUNNER_TEMP/dist" && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@v6
        with:
          name: kern-${{ steps.plan.outputs.version }}
          path: ${{ runner.temp }}/dist/
          if-no-files-found: error

  # The bare application builds and its tests pass within its budget, through the battery every
  # application calls.
  template:
    uses: ./.github/workflows/kern-battery.yml
    with:
      directory: kern/template

  publish:
    needs: [build, template]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: kern-${{ needs.build.outputs.version }}
          path: dist
      - name: Publish the release where it is missing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          # A release that exists is never changed: a kern change without a new version releases nothing.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "kern-release: $TAG is released already; change kern/release.toml's version to cut the next"
            exit 0
          fi
          notes="kern $VERSION, the bare core, for linux, darwin and windows on amd64 and arm64. Verify with sha256sum -c SHA256SUMS (kern/README.md \"Release\")."
          if ! gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "kern $VERSION" --notes "$notes" dist/*; then
            echo "::error::kern-release: GitHub refused release $TAG on $GITHUB_SHA; where a tag ruleset refuses kern-v*, allow this workflow to create it (Settings > Rules > Rulesets), then run this workflow on main again"
            exit 1
          fi
          echo "kern-release: published $TAG on $GITHUB_SHA"
