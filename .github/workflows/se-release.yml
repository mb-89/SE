# SE's own binary release: the `se` binary, kern's core plus SE's Go components (components/cmd/se),
# for six platforms with SHA256SUMS, through kern's reusable release workflow (kern-release.yml,
# kern's README "Release"), on kern at the commit se.lock locks for components/go.mod's require kern.
# components/release.toml owns its version and the tag scheme se-v<version>, distinct from SE's own
# v<version> release tags (release.yml) and kern's v<version> in kern's repository.
#
# On a pull request it only builds the six archives (no publish, so a branch proves the build). On a
# push to main it publishes the release se-v<version> where it does not exist yet, so the push that
# changes components/release.toml's version cuts it; a release that exists is never changed. A rerun
# is workflow_dispatch on main. The build runs on a change to the binary's inputs: SE's Go
# components (components/go.mod's require kern among them), se.lock, se.toml, or either release
# workflow.
name: se-release

on:
  pull_request:
    paths:
      - "components/**"
      - "se.lock"
      - "se.toml"
      - ".github/workflows/se-release.yml"
      - ".github/workflows/kern-release.yml"
  push:
    branches: [main]
    paths:
      - "components/**"
      - "se.lock"
      - "se.toml"
      - ".github/workflows/se-release.yml"
      - ".github/workflows/kern-release.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    uses: ./.github/workflows/kern-release.yml
    permissions:
      contents: write
    with:
      directory: components
