# Merges main into every auto-merge PR behind it and approves its CI run, with the
# repository's own token, since main merges only PRs up to date with it
# (spec/coordination.md).
name: refresh
on:
  push:
    branches: [main]
  schedule:
    - cron: "41 * * * *"
permissions:
  actions: write
  contents: write
  pull-requests: write
concurrency:
  group: refresh
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum
      - run: sh src/build.sh se
      # Its output names every PR it updated, and the head whose CI run it approved.
      - run: ./se fleet refresh --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
