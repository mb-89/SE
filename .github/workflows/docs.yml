# Builds se's GitHub Pages site and publishes it (README "Documentation"): the documentation as
# index.html and the Timeline as timeline.html. Pages publishes one artifact, so both are built in
# every run. The Timeline rebuilds hourly (which also follows the other repositories it shows) and
# on each issue event here; the documentation changes only with a push.
name: docs

on:
  push:
    branches: [se]
  schedule:
    - cron: "23 * * * *"
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled, deleted, transferred]
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Scheduled and issue runs start on the default branch; the site is always built from se.
      - uses: actions/checkout@v4
        with:
          ref: se
      - uses: astral-sh/setup-uv@v6
      - name: Build the documentation
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          python3 scripts/build_docs.py --destination "$RUNNER_TEMP/site/index.html"
      - name: Build the Timeline
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/timeline.py --destination "$RUNNER_TEMP/site/timeline.html"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site

  # Runs only after a successful build, so a failed build leaves the published artifact in place.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
