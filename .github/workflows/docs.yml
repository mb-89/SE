# Builds se's GitHub Pages site and publishes it (README "Documentation"): the documentation as
# index.html and the Timeline as timeline.html. Pages publishes one artifact, so both are built in
# every run. The Timeline rebuilds hourly (which also follows the other repositories it shows) and
# on each issue event here; the documentation changes only with a push.
name: docs

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 * * * *"
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled, deleted, transferred]
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      # The build runs RUNME in its copy of the repository, which takes the pinned se from ~/.se/bin
      # (README "Documentation"): placed here from the checkout, fetched from its release, or built
      # with go where that release is not out yet. The cache keeps each se version and the claude
      # RUNME installs, so each is fetched or built once.
      - uses: actions/setup-go@v6
        with:
          go-version-file: components/go.mod
          cache-dependency-path: components/go.sum
      - uses: actions/cache@v5
        with:
          path: |
            ~/.local/bin/claude
            ~/.local/share/claude
            ~/.se/bin
          key: se-${{ runner.os }}-${{ hashFiles('components/release.toml') }}
      - name: Place the pinned se
        run: |
          python3 scripts/se_modules.py sync
          bash scripts/bootstrap.sh --binary
      # obs builds with the adapter component obs-html, found among the installed ones (README
      # "Documentation"); a build installs it where it is missing, and fails naming
      # obs-components install obs-html where it cannot.
      - name: Install obs's adapter component obs-html
        run: python3 scripts/build_docs.py --install-html
      - name: Build the documentation
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          python3 scripts/build_docs.py --destination "$RUNNER_TEMP/site/index.html"
      - name: Build the Timeline
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/timeline.py --destination "$RUNNER_TEMP/site/timeline.html"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/site

  # Runs only after a successful build, so a failed build leaves the published artifact in place.
  deploy:
    needs: build
    runs-on: ubuntu-26.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
