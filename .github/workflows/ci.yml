name: ci
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # tests/tools.sh pins every tool, Go among them.
      - id: pins
        run: . ./tests/tools.sh && echo "go=$GO" >>"$GITHUB_OUTPUT"
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.pins.outputs.go }}
          cache-dependency-path: src/go.sum
      # The battery writes its stamp once it passed, the hash of the tree it
      # passed with the stamp left out (tests/battery.stamp, the issues
      # instance's config/stamp), and se issue land and se issue keep commit
      # it with the work. se fleet trust computes the same hash of the tree
      # checked out here, on a PR's merge with main and on a push to main:
      # where the stamp names it, CI runs nothing more; where it does not
      # (main moved, the stamp is missing or stale), it runs the battery
      # (spec/coordination.md). It reads no GitHub.
      - id: trust
        # se is built outside the checkout, which the battery wants clean; a
        # tree whose se does not build is not trusted either.
        run: |
          se="$RUNNER_TEMP/se"
          if sh src/build.sh "$se" && "$se" fleet trust --workspace "$PWD"; then
            echo "trusted=true" >>"$GITHUB_OUTPUT"
          fi
      - if: steps.trust.outputs.trusted != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      # The plugin checks run offline; the CLI needs no login for them.
      - if: steps.trust.outputs.trusted != 'true'
        run: npm i -g @anthropic-ai/claude-code@2.1.296
      - if: steps.trust.outputs.trusted != 'true'
        run: sh ./tests/tools.sh install
      - if: steps.trust.outputs.trusted != 'true'
        run: sh ./tests/check.sh
      # The battery's profile, for the retro: every step's, every Go test's and every plugin test's duration.
      - uses: actions/upload-artifact@v4
        if: always() && steps.trust.outputs.trusted != 'true'
        with:
          name: battery
          path: .se/.runtime/battery/
          include-hidden-files: true
          if-no-files-found: ignore
