name: ci
# main merges a PR once its own CI is green, without bringing it up to date
# first, so main is checked again after every merge (spec/coordination.md).
on:
  pull_request:
  push:
    branches: [main]
# A PR's newer push cancels its older run. main's running check always
# finishes; of main's waiting ones only the newest runs, which holds the rest.
concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # tests/tools.sh pins every tool, Go among them.
      - id: pins
        run: . ./tests/tools.sh && echo "go=$GO" >>"$GITHUB_OUTPUT"
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.pins.outputs.go }}
          cache-dependency-path: src/go.sum
      # The battery writes the tree it passed (HEAD's git tree without that
      # file) into one file of the checkout, battery/config/passed, and se
      # issue land and se issue keep commit it with the work. Where the
      # commit checked out here (github.sha: a PR's merge commit, or the push)
      # holds that file naming its own tree, CI trusts it and runs nothing
      # more; a missing or stale file (main moved, say) runs the battery
      # (spec/coordination.md). It asks GitHub nothing.
      - id: trust
        # se is built outside the checkout, which the battery wants clean; a
        # tree whose se does not build is not trusted either.
        run: |
          se="$RUNNER_TEMP/se"
          if sh src/build.sh "$se" && "$se" fleet trust --rev "$GITHUB_SHA"; then
            echo "trusted=true" >>"$GITHUB_OUTPUT"
          fi
      - if: steps.trust.outputs.trusted != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      # The plugin checks run offline; the CLI needs no login for them.
      - if: steps.trust.outputs.trusted != 'true'
        run: npm i -g @anthropic-ai/claude-code@2.1.296
      - if: steps.trust.outputs.trusted != 'true'
        run: sh ./tests/tools.sh install
      - if: steps.trust.outputs.trusted != 'true'
        run: sh ./tests/check.sh
      # The battery's profile, for the retro: every step's, every Go test's and every plugin test's duration.
      - uses: actions/upload-artifact@v4
        if: always() && steps.trust.outputs.trusted != 'true'
        with:
          name: battery
          path: .se/.runtime/battery/
          include-hidden-files: true
          if-no-files-found: ignore
