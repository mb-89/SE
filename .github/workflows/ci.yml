name: ci
on:
  pull_request:
concurrency:
  group: ci-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
permissions:
  contents: read
  statuses: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # tests/tools.sh pins every tool, Go among them.
      - id: pins
        run: . ./tests/tools.sh && echo "go=$GO" >>"$GITHUB_OUTPUT"
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.pins.outputs.go }}
          cache-dependency-path: src/go.sum
      # A box pushes only a tree its battery passed, and posts the se/battery
      # status naming it on the commit (se issue land, se issue keep). Where
      # the head carries it for the tree checked out here, posted by an
      # account that writes to the repository, CI trusts it and runs nothing
      # more; any other push runs the battery (spec/coordination.md).
      - id: trust
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        # se is built outside the checkout, which the battery wants clean; a
        # tree whose se does not build is not trusted either.
        run: |
          se="$RUNNER_TEMP/se"
          if sh src/build.sh "$se" && "$se" fleet trust --repo "$GITHUB_REPOSITORY" --sha "$HEAD_SHA" --tree "$(git rev-parse 'HEAD^{tree}')"; then
            echo "trusted=true" >>"$GITHUB_OUTPUT"
          fi
      - if: steps.trust.outputs.trusted != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      # The plugin checks run offline; the CLI needs no login for them.
      - if: steps.trust.outputs.trusted != 'true'
        run: npm i -g @anthropic-ai/claude-code@2.1.296
      - if: steps.trust.outputs.trusted != 'true'
        run: sh ./tests/tools.sh install
      - if: steps.trust.outputs.trusted != 'true'
        run: sh ./tests/check.sh
      # The battery's profile, for the retro: every step's, every Go test's and every plugin test's duration.
      - uses: actions/upload-artifact@v4
        if: always() && steps.trust.outputs.trusted != 'true'
        with:
          name: battery
          path: .se/.runtime/battery/
          include-hidden-files: true
          if-no-files-found: ignore
