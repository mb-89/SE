name: ci
on:
  pull_request:
  # se fleet refresh starts it on a PR head it brought up to date with main.
  workflow_dispatch:
concurrency:
  group: ci-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # tests/tools.sh pins every tool, Go among them.
      - id: pins
        run: . ./tests/tools.sh && echo "go=$GO" >>"$GITHUB_OUTPUT"
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.pins.outputs.go }}
          cache-dependency-path: src/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The plugin checks run offline; the CLI needs no login for them.
      - run: npm i -g @anthropic-ai/claude-code@2.1.296
      - run: sh ./tests/tools.sh install
      - run: sh ./tests/check.sh
      # The battery's profile, for the retro: every step's, every Go test's and every plugin test's duration.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: battery
          path: .se/.runtime/battery/
          include-hidden-files: true
          if-no-files-found: ignore
