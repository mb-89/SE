[project]
# The project's one semantic version, bumped by work_tickets.py push (README "Project settings").
version = "5.50.1"
# Its tag v<version> is pushed by the release workflow, not by push (README "Release tags").
release = "workflow"
# Regenerates what copies the version (the plugin manifests) into each release commit.
release_build = ["uv", "run", "python", "scripts/se_plugin.py", "build"]
# The commit identity sync sets where the machine sets no public_identity (README "Project settings").
identity = "mb <mb>"
# Every push to the integration branch runs se's public check first (README "Project settings").
public_check = true
# Where the documentation built from docs.md is published (README "Documentation").
docs_url = "https://mb-89.github.io/SE/"
authored_content = [
    "AGENTS.md",
    "README.md",
    ".github/ISSUE_TEMPLATE/*.md",
    ".github/pull_request_template.md",
    "src/**/*.md",
    "docs.md",
]

# SE builds its own binary, kern's core plus SE's Go components (components/README.md). This names
# where that binary's release.toml lives; bootstrap.sh fetches, builds and starts it instead of the
# bare kern (SE's docs/go-core.md "How the binary arrives"). An application with no Go components
# sets no [binary] and keeps running the bare kern.
[binary]
release = "components/release.toml"

# The complete suite and its time budget; work_tickets.py integrate holds every integration to it
# (README "Test budget").
[tests]
command = ["uv", "run", "pytest", "-q"]
target_seconds = 60
limit_seconds = 120

# kern's Go tests (kern/README.md "Tests"), run after the suite with their own time and budget.
# A cold build of kern with NATS compiles in about 19 to 23 s (docs/go-core.md "Measurements"), its
# test binaries once 35.1 s on CI: setup builds them first, outside the budget, which judges the tests.
[tests.beside.kern]
setup = ["go", "test", "-run", "^$", "./..."]
command = ["go", "test", "./..."]
directory = "kern"
target_seconds = 30
limit_seconds = 60

# SE's Go components (components/README.md "Tests"), after kern's with Go's build cache warm; their
# agreement test runs SE's Python fleet check and retro count beside the Go ones.
[tests.beside.go-components]
command = ["go", "test", "./..."]
directory = "components"
target_seconds = 30
limit_seconds = 60

# The released binaries hold what the checkout builds (docs/go-core.md "How the binary arrives"):
# kern's release tool refuses where kern's or SE's release.toml names a tag already cut and a file
# its binary is built from changed since that tag; the remedy is a raised version, which the landing
# cuts. It reads the tags git fetched; a tag not fetched yet refuses nothing.
[tests.beside.release-guard]
command = ["go", "run", "./tools/release", "guard", "--dir", ".", "--dir", "../components"]
directory = "kern"
target_seconds = 10
limit_seconds = 30

# `se new app`'s acceptance (README "New application"): an application created from this SE passes
# its own test run, which builds its core. After kern's tests Go's build cache is warm: 6.8 s here;
# with a cold cache 25 s.
[tests.beside.new-app]
command = ["uv", "run", "pytest", "-q", "-n", "0", "tests/beside_new_app.py"]
target_seconds = 30
limit_seconds = 90

# SE's commands as components against the real core (README "Commands as components"): it builds
# kern's binary with Go's cache warm, places the four components and calls through them.
[tests.beside.se-components]
command = ["uv", "run", "pytest", "-q", "-n", "0", "tests/beside_se_components.py"]
target_seconds = 30
limit_seconds = 90

# SE's GitHub reads through kern's relay against the real core (README "Hand-offs through the
# relay"): it builds kern's binary with Go's cache warm, lands a PostToolUse answer and reads it.
[tests.beside.se-relay]
command = ["uv", "run", "pytest", "-q", "-n", "0", "tests/beside_se_relay.py"]
target_seconds = 30
limit_seconds = 90

# The ad hoc scripts' runs against the real core (docs/go-core.md "Scripts are ad hoc, components
# are long-term"): it builds kern's binary with Go's cache warm, posts a shell tool's PostToolUse
# three times for an untracked script and reads the count through `retro.py collect`.
[tests.beside.script-runs]
command = ["uv", "run", "pytest", "-q", "-n", "0", "tests/beside_script_runs.py"]
target_seconds = 30
limit_seconds = 90

# obs builds the documentation (README "Documentation").
[modules.obs]
url = "https://github.com/mb-89/obs.git"
version = "^2.0"

# The repositories the Timeline page shows, one lane each (scripts/timeline.py).
[timeline]
repositories = ["mb-89/SE", "mb-89/obs"]

# The repositories SE watches for outside issues, each with the last issue number that existed
# before the fleet marked its own (work model "Outside issues").
[outside]
"github.com/mb-89/SE" = 690
"github.com/mb-89/obs" = 459

# The outside skills each role relies on, `<plugin>@<marketplace>:<skill>`: se_plugin.py build
# preloads them into that agent and the start greeting names one the session lacks (AGENTS.md
# "Agents and skills"). SE's agents rely on none outside SE today.
[roles.se]
skills = []

[roles.integrator]
skills = []

[roles.reviewer]
skills = []

[roles.worker]
skills = []
