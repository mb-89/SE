[project]
# The project's one semantic version, bumped by work_tickets.py push (README "Project settings").
version = "5.134.1"
# Its tag v<version> is pushed by the release workflow, not by push (README "Release tags").
release = "workflow"
# Regenerates what copies the version (the plugin manifests) into each release commit.
release_build = ["uv", "run", "python", "scripts/se_plugin.py", "build"]
# The commit identity sync sets where the machine sets no public_identity (README "Project settings").
identity = "mb <mb>"
# Every push to the integration branch runs se's public check first (README "Project settings").
public_check = true
# Where the documentation built from docs.md is published is derived from origin: no docs_url
# here (README "Documentation").
authored_content = [
    "AGENTS.md",
    "README.md",
    ".github/ISSUE_TEMPLATE/*.md",
    ".github/pull_request_template.md",
    "src/**/*.md",
    "docs.md",
]

# SE builds its own binary, kern's core plus SE's Go components (components/README.md). This names
# where that binary's release.toml lives; bootstrap.sh fetches, builds and starts it instead of the
# bare kern (SE's docs/go-core.md "How the binary arrives"). An application with no Go components
# sets no [binary] and keeps running the bare kern.
[binary]
release = "components/release.toml"

# How a landing reaches main: "fast-forward" moves main to the tested landing commit, the
# integrator's own, so no commit on main carries an address (README "Landing on main").
[integrate]
landing = "fast-forward"

# The filing commands check each ticket against its template (README "Templates"): `refuse` files none that
# lacks a part its template requires. Read from the integration branch, so a branch cannot switch it off.
[templates]
enforce = "refuse"
# SE's PreToolUse hook refuses a GitHub write through the GitHub tools whose body breaks its template
# (README "Templates"); read from the integration branch like enforce.
gate = "refuse"

# The complete suite and its time budget; work_tickets.py integrate holds every integration to it
# (README "Test budget").
[tests]
command = ["uv", "run", "pytest", "-q"]
target_seconds = 60
limit_seconds = 120

# SE's Go components (components/README.md "Tests"), on kern at its pin: setup places it, the
# clone components/go.mod replaces kern by (se.toml [modules.kern]); kern's own tests run in kern's
# repository. Their agreement test runs SE's Python fleet check and retro count beside the Go ones.
[tests.beside.go-components]
setup = ["uv", "run", "python", "../scripts/se_modules.py", "sync", "kern"]
command = ["go", "test", "./..."]
directory = "components"
target_seconds = 30
limit_seconds = 60

# The released binaries hold what the checkout builds (docs/go-core.md "How the binary arrives"):
# kern's release tool refuses where SE's release.toml names a tag already cut and a file its binary
# is built from changed since that tag, components/go.mod's require kern among them; the remedy is a kind stated in the field report,
# whose version the landing assigns (README "Component versions"). It reads the tags git fetched; a
# tag not fetched yet refuses nothing.
[tests.beside.release-guard]
setup = ["uv", "run", "python", "../scripts/se_modules.py", "sync", "kern"]
command = ["go", "run", "kern/tools/release", "guard", "--dir", "."]
directory = "components"
target_seconds = 10
limit_seconds = 30

# `se new app`'s acceptance (README "New application"): an application created from this SE passes
# its own test run, which builds its core. After the components' tests Go's build cache is warm:
# 6.8 s here; with a cold cache 25 s. Like every pytest run, it places kern first (tests/conftest.py).
[tests.beside.new-app]
command = ["uv", "run", "pytest", "-q", "-n", "0", "tests/beside_new_app.py"]
target_seconds = 30
limit_seconds = 90

# SE's commands as components against the real core (README "Commands as components"): it builds
# kern's binary with Go's cache warm, places the four components and calls through them.
[tests.beside.se-components]
command = ["uv", "run", "pytest", "-q", "-n", "0", "tests/beside_se_components.py"]
target_seconds = 30
limit_seconds = 90

# SE's GitHub reads through kern's relay against the real core (README "Hand-offs through the
# relay"): it builds kern's binary with Go's cache warm, lands a PostToolUse answer and reads it.
[tests.beside.se-relay]
command = ["uv", "run", "pytest", "-q", "-n", "0", "tests/beside_se_relay.py"]
target_seconds = 30
limit_seconds = 90

# The ad hoc scripts' runs against the real core (docs/go-core.md "Scripts are ad hoc, components
# are long-term"): it builds kern's binary with Go's cache warm, posts a shell tool's PostToolUse
# three times for an untracked script and reads the count through `retro.py collect`.
[tests.beside.script-runs]
command = ["uv", "run", "pytest", "-q", "-n", "0", "tests/beside_script_runs.py"]
target_seconds = 30
limit_seconds = 90

# SE installed beside an empty project, checked without Copilot (docs/copilot.md "Self-test"): the
# layout, the hooks, the MCP door's launcher, handshake and one call. It builds the door's binary
# from this tree with Go's cache warm, so it runs beside the suite, not in its budget.
[tests.beside.copilot-self-test]
setup = ["uv", "run", "python", "scripts/se_modules.py", "sync", "kern"]
command = ["uv", "run", "python", "scripts/copilot.py", "self-test", "--build"]
target_seconds = 30
limit_seconds = 90

# obs builds the documentation (README "Documentation").
[modules.obs]
url = "../obs.git"
version = "^5.0"

# kern, the Go core SE's binary is built on (docs/go-core.md "Pinning it"): its pin is the version
# components/go.mod requires, so a move of that line is a change of se's inputs (README "Modules").
[modules.kern]
url = "../kern.git"
go = "components/go.mod"

# The repositories the Timeline page shows, one lane each (scripts/timeline.py): a bare name beside
# SE's home, which comes from origin (scripts/se_home.py).
[timeline]
repositories = ["SE", "obs", "kern"]

# The repositories SE watches for outside issues, each with the last issue number that existed
# before the fleet marked its own (work model "Outside issues"); a bare name lies beside SE's home.
[outside]
"SE" = 690
"obs" = 459

# The plugin's build (scripts/se_plugin.py): `root_mcp` writes a root .mcp.json declaring SE's MCP
# door. Off, as Claude Code reads that file too; Copilot reads .github/mcp.json, always written
# (README "MCP door").
# `claude_mcp` declares the door in the Claude Code manifest, .claude-plugin/plugin.json: on, every
# Claude Code session with SE's plugin starts the door (README "The MCP door"). Off on this branch
# until the owner answers whether SE's own default is on.
[plugin]
root_mcp = false
claude_mcp = false

# The outside skills each role relies on, `<plugin>@<marketplace>:<skill>`: se_plugin.py build
# preloads them into that agent and the start greeting names one the session lacks (AGENTS.md
# "Agents and skills"). SE's agents rely on none outside SE today.
[roles.se]
skills = []

[roles.integrator]
skills = []

[roles.reviewer]
skills = []

[roles.worker]
skills = []
