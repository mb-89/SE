[project]
# The branch the integrator writes; the new process lives on `se` while the old one lives on `main`.
integration_branch = "se"
# The commit identity sync sets where the machine sets no public_identity (README "Project settings").
identity = "mb <mb>"
# Every push to the integration branch runs se's public check first (README "Project settings").
public_check = true
authored_content = [
    "AGENTS.md",
    "README.md",
    ".github/**/*.md",
]

# The complete suite and its time budget; work_tickets.py integrate holds every integration to it
# (README "Test budget").
[tests]
command = ["uv", "run", "pytest", "-q"]
target_seconds = 60
limit_seconds = 120
