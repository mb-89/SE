# SE's switches, fleet group: what the integrator's landing and fleet check read
# (scripts/se_switches.py's docstring owns this format, core.toml's header its keys).

[[switch]]
name = "[integrate] review_gate"
kind = "se.toml"
reader = "scripts/review_gate.py"
default = "off"
layers = ["se.toml"]
key = "integrate.review_gate"
help = "README.md#review-gate"
note = "off: integrate reads no review; on: a risky change lands only with a reviewer's pass of its head"

[[switch]]
name = "[fleet] restart_after_limit"
kind = "se.toml"
reader = "scripts/limit_restart.py"
default = "off"
layers = ["se.toml"]
key = "fleet.restart_after_limit"
help = "README.md#fleet-check"
note = "off: a worker stopped on a usage limit is reported only; on: the remedy resumes it once the limit lifts, once per issue"

[[switch]]
name = "[integrate] landing"
kind = "se.toml"
reader = "scripts/work_tickets.py"
default = "off"
layers = ["se.toml"]
key = "integrate.landing"
on = ["fast-forward"]
off = ["squash"]
help = "README.md#landing-on-main"
note = "off (squash): GitHub squash-merges the landing pull request; on (fast-forward): the integrator writes the landing commit as the project identity and main moves to exactly it"
