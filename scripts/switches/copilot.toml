# SE's switches, copilot group: the request guards under GitHub Copilot
# (scripts/copilot_guards.py), one [[switch]] each; core.toml's header owns the keys of a row,
# scripts/se_switches.py's docstring the format.

[[switch]]
name = "[copilot] refuse_stop"
kind = "se.toml"
reader = "scripts/copilot_guards.py"
default = "off"
layers = ["se.toml"]
key = "copilot.refuse_stop"
help = "docs/copilot.md#what-a-session-costs"
note = "off (false or unset): the guard holds under Copilot, the Stop hook never refuses a stop and says what is undelivered; on brings back the refusing Stop hook; under Claude Code nothing reads it"

[[switch]]
name = "[copilot] start_sessions"
kind = "se.toml"
reader = "scripts/copilot_guards.py"
default = "on"
layers = ["se.toml"]
key = "copilot.start_sessions"
help = "docs/copilot.md#what-a-session-costs"
note = "on (true or unset): SE dispatches sessions automatically under Copilot without project configuration; off (false): SE starts no session and prints the line that starts one; under Claude Code nothing reads it"
