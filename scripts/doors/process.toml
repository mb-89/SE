# The process door (rule book des-004): every program SE runs as a child process starts through
# scripts/process_door.py (`run`, or `start` for one that runs beside SE), git through
# scripts/git_door.py and a shell through scripts/shell_door.py, the three doors that start one.
# Read by scripts/door_report.py, whose docstring owns the keys.
#
# Its ground is the code that runs, not the tests: a test's start is the spawn guard's
# (scripts/spawn_guard.py), which refuses one outside a contract or entry-point test at runtime.
door = "process"
level = "error"
files = ["scripts/process_door.py", "scripts/git_door.py", "scripts/shell_door.py"]
contract_tests = ["tests/test_process_door.py"]
ground = ["scripts", "components"]
calls = [
    "subprocess.run", "subprocess.Popen", "subprocess.call", "subprocess.check_call",
    "subprocess.check_output", "subprocess.getoutput", "subprocess.getstatusoutput",
    "os.system", "os.popen", "os.startfile",
    "os.execl", "os.execle", "os.execlp", "os.execlpe", "os.execv", "os.execve", "os.execvp", "os.execvpe",
    "os.spawnl", "os.spawnle", "os.spawnlp", "os.spawnlpe", "os.spawnv", "os.spawnve", "os.spawnvp", "os.spawnvpe",
    "os.posix_spawn", "os.posix_spawnp",
    "asyncio.create_subprocess_exec", "asyncio.create_subprocess_shell",
]
