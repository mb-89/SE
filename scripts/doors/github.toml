# GitHub: gh, its binary's one resolver and the REST API's host. Read by scripts/door_report.py, whose
# docstring owns the keys.
#
# GitHub decides nothing yet: which of today's reaches is the one GitHub door is the owner's question,
# so `files` is empty and every reach counts, at warn while they move behind the door once it is
# named. Calls into a candidate door, such as work_tickets.py's run_gh and run_gh_with_body, are not
# reaches until the owner names the door; gh_executable, where run_gh resolves the binary, is.
door = "github"
level = "warn"
files = []
contract_tests = []
commands = ["gh"]
imports = []
calls = ["gh_executable"]
literals = ["api.github.com"]
