# The git door (rule book des-004): every git command runs through scripts/git_door.py and its fake is
# tests/fake_git.py, as scripts/hygiene.py's GIT_DOOR names them; kern's Go door is held in kern's own
# repository.
# Read by scripts/door_report.py, whose docstring owns the keys.
door = "git"
files = ["scripts/git_door.py", "tests/fake_git.py"]
contract_tests = ["tests/test_git_door.py"]
commands = ["git"]
imports = []
calls = []
literals = []

# Empty, like hygiene.py's GIT_ALLOWED: no git subprocess is left outside the door.
[baseline]
