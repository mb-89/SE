door = "git"
files = ["scripts/git_door.py", "tests/fake_git.py", "kern/git/git.go"]
contract_tests = ["tests/test_git_door.py", "kern/git/contract_test.go"]
commands = ["git"]
imports = []
calls = []
literals = []

