# Claude Code.

[[limits]]
surface = "claude-code"
subject = "instructions-file"
value = 4194304
unit = "bytes"
source = "https://code.claude.com/docs/en/memory"
read = 2026-11-14
mark = "documented"
note = "Claude Code skips a file over 4 MiB."

[[limits]]
surface = "claude-code"
subject = "instructions-file"
value = 200
unit = "lines"
source = "https://code.claude.com/docs/en/memory"
read = 2026-11-14
mark = "documented"
note = "A target, not a refusal: target under 200 lines per CLAUDE.md file."

[[limits]]
surface = "claude-code"
subject = "skill-description"
value = 1536
unit = "characters"
source = "https://code.claude.com/docs/en/skills"
read = 2026-11-14
mark = "documented"
note = "description and when_to_use together are truncated at 1,536 characters in the skill listing."

[[limits]]
surface = "claude-code"
subject = "skill-length"
value = 500
unit = "lines"
source = "https://code.claude.com/docs/en/skills"
read = 2026-11-14
mark = "documented"
note = "A target, not a refusal: keep SKILL.md under 500 lines."

[[limits]]
surface = "claude-code"
subject = "skill-listing"
value = 8000
unit = "characters"
source = "https://code.claude.com/docs/en/env-vars"
read = 2026-11-14
mark = "documented"
note = "The budget is 1% of the context window, with a fallback of 8,000 characters; over it, descriptions are dropped."

[[limits]]
surface = "claude-code"
subject = "mcp-tool-description"
value = 4096
unit = "characters"
source = "https://code.claude.com/docs/en/mcp"
read = 2026-11-14
mark = "documented"
note = "For a tool that loads upfront; 16,384 for one loaded through tool search."

[[limits]]
surface = "claude-code"
subject = "tool-name"
value = 128
unit = "characters"
measures = "mcp__{server}__{tool}"
source = "https://code.claude.com/docs/en/mcp"
read = 2026-11-14
mark = "documented"
note = "A tool whose full name is over 128 characters is left out of the tools sent to Claude."

[[limits]]
surface = "claude-code"
subject = "tool-output-offload"
value = 50000
unit = "characters"
source = "https://code.claude.com/docs/en/mcp"
read = 2026-11-14
mark = "documented"
note = "A successful MCP text result longer than this is saved to a file; MAX_MCP_OUTPUT_TOKENS (25000) caps tokens."

[[limits]]
surface = "claude-code"
subject = "hook-timeout"
value = 600
unit = "seconds"
source = "https://code.claude.com/docs/en/hooks"
read = 2026-11-14
mark = "documented"
note = "The default for command hooks; 30 on UserPromptSubmit."

[[limits]]
surface = "claude-code"
subject = "mcp-start-timeout"
value = 30000
unit = "milliseconds"
source = "https://code.claude.com/docs/en/env-vars"
read = 2026-11-14
mark = "documented"
note = "The default of MCP_TIMEOUT."

# Registrations: each place a host reads SE from, by surface, as scripts/host_registrations.py
# reads it (se_doctor.py --probe reports them). A place:
#   place     what the report calls it
#   kind      hooks (a hooks file: SE's commands are those naming `finds`) | mcp (an MCP config:
#             SE's server is the one named `finds`)
#   base      where `file` lies: project (the repository the host opened), home, checkout (SE's own
#             checkout, the one measured), plugin (each installed SE plugin's root, Claude Code's
#             plugin roots), copilot-plugin (each plugin folder Copilot CLI installed under
#             $COPILOT_HOME, or ~/.copilot where that is unset: installed-plugins/<marketplace>/<plugin>
#             or installed-plugins/_direct/<source>, counted where its .github/plugin/plugin.json or
#             .claude-plugin/plugin.json is named se; Copilot starts its commands in that folder;
#             source https://docs.github.com/en/copilot/reference/cli-plugin-reference, "File locations")
#   file      relative to base; file_<platform> (windows, darwin) where it differs
#   outside   whether the place works in a repository other than SE's own checkout
#   source, read, mark  as for a limit; mark `unverified` where the source does not name the fact
#   note      optional
#   register  the line that registers SE there, run in the project; register_windows, a
#             PowerShell line, where it differs. {launcher} and {launcher_ps1} are this checkout's
#             scripts/se_mcp.sh and scripts/se_mcp.ps1, {checkout} the checkout, {tracker} the
#             `<owner>/<repository>` of SE's home, from the checkout's origin (scripts/se_home.py).
#   hidden_by optional: a base whose found roots hide this place's server (a plugin's outranks it)
#   register_hidden  with hidden_by: the fix line while such a root is found, in place of register;
#             register_hidden_windows where it differs

[[registrations.claude-code.places]]
place = "plugin hooks"
kind = "hooks"
base = "plugin"
file = ".claude-plugin/plugin.json"
finds = "bootstrap.sh"
outside = true
source = "https://code.claude.com/docs/en/plugins-reference"
read = 2026-11-14
mark = "documented"
register = "claude plugin install se --marketplace {tracker}"

[[registrations.claude-code.places]]
place = "MCP door"
kind = "mcp"
base = "project"
file = ".mcp.json"
finds = "se"
outside = true
source = "https://code.claude.com/docs/en/mcp"
read = 2026-11-14
mark = "documented"
register = 'claude mcp add --scope project se -- bash "{launcher}" --root .'
register_windows = 'claude mcp add --scope project se -- powershell -NoProfile -ExecutionPolicy Bypass -File "{launcher_ps1}" --root .'

[[registrations.claude-code.places]]
place = "plugin MCP door"
kind = "mcp"
base = "plugin"
file = ".claude-plugin/plugin.json"
finds = "se"
outside = true
source = "https://code.claude.com/docs/en/hooks"
read = 2026-11-22
mark = "measured"
note = "Written where SE's se.toml [plugin] claude_mcp is on; its tools are mcp__plugin_se_se__<tool>. Measured 2026-11-22 in Claude Code 2.1.330 on Linux: a plugin's stdio server starts in the project folder, with CLAUDE_PROJECT_DIR (the project) and CLAUDE_PLUGIN_ROOT (the plugin) in its environment, as the hooks reference says of CLAUDE_PROJECT_DIR."
register = "claude plugin install se --marketplace {tracker}"

[[registrations.copilot-cli.places]]
place = "hooks"
kind = "hooks"
base = "project"
file = ".github/hooks/se.json"
finds = "bootstrap.sh"
outside = false
source = "README.md#install"
read = 2026-11-14
mark = "documented"
register = 'cd "{checkout}" && uv run python scripts/se_plugin.py build'
register_windows = 'cd "{checkout}"; uv run python scripts/se_plugin.py build'

[[registrations.copilot-cli.places]]
place = "MCP door"
kind = "mcp"
base = "project"
file = ".github/mcp.json"
finds = "se"
outside = false
source = "README.md#the-mcp-door"
read = 2026-11-14
mark = "documented"
note = "The CLI plugin reference lists .github/mcp.json only inside a plugin's folder."
register = 'cd "{checkout}" && uv run python scripts/se_plugin.py build'
register_windows = 'cd "{checkout}"; uv run python scripts/se_plugin.py build'

[[registrations.copilot-cli.places]]
place = "user MCP config"
kind = "mcp"
base = "home"
file = ".copilot/mcp-config.json"
finds = "se"
outside = true
source = "https://docs.github.com/en/copilot/reference/cli-plugin-reference"
read = 2026-11-14
mark = "documented"
note = "An installed plugin's se outranks this user-level se: user config ranks below plugins. Add the door per session instead (docs/copilot.md, \"The door by hand\")."
register = 'copilot mcp add se -- bash "{launcher}" --root .'
register_windows = 'copilot mcp add se -- powershell -NoProfile -ExecutionPolicy Bypass -File "{launcher_ps1}" --root .'
hidden_by = "copilot-plugin"
register_hidden = 'copilot --agent se --additional-mcp-config "{\"mcpServers\":{\"se\":{\"type\":\"local\",\"command\":\"bash\",\"args\":[\"{launcher}\",\"--root\",\"$(git rev-parse --show-toplevel)\"],\"tools\":[\"*\"]}}}"'
register_hidden_windows = 'see docs/copilot.md, "The door by hand", Windows: write the entry naming "{launcher_ps1}" to a file, then copilot --agent se --additional-mcp-config "@$env:TEMP\se-mcp.json"'

[[registrations.copilot-cli.places]]
place = "plugin manifest"
kind = "mcp"
base = "checkout"
file = ".github/plugin/plugin.json"
finds = "se"
outside = true
source = "https://docs.github.com/en/copilot/reference/cli-plugin-reference"
read = 2026-11-14
mark = "documented"
register = "copilot plugin install {tracker}"

[[registrations.copilot-cli.places]]
place = "installed plugin MCP"
kind = "mcp"
base = "copilot-plugin"
file = ".github/mcp.json"
finds = "se"
outside = true
source = "https://docs.github.com/en/copilot/reference/cli-plugin-reference#file-locations"
read = 2026-11-14
mark = "documented"
register = "copilot plugin marketplace add {tracker} && copilot plugin install se@se"
register_windows = "copilot plugin marketplace add {tracker}; copilot plugin install se@se"

[[registrations.copilot-vscode.places]]
place = "workspace MCP config"
kind = "mcp"
base = "project"
file = ".mcp.json"
finds = "se"
outside = true
source = "https://code.visualstudio.com/docs/copilot/customization/mcp-servers"
read = 2026-11-14
mark = "documented"
register = '''code --add-mcp '{"name":"se","command":"bash","args":["'"{launcher}"'","--root","${workspaceFolder}"]}' '''
register_windows = '''code --add-mcp (@{name='se';command='powershell';args=@('-NoProfile','-ExecutionPolicy','Bypass','-File',"{launcher_ps1}",'--root','${workspaceFolder}')} | ConvertTo-Json -Compress).Replace('"','\"')'''

[[registrations.copilot-vscode.places]]
place = "user MCP config"
kind = "mcp"
base = "home"
file = ".config/Code/User/mcp.json"
file_darwin = "Library/Application Support/Code/User/mcp.json"
file_windows = "AppData/Roaming/Code/User/mcp.json"
finds = "se"
outside = true
source = "https://code.visualstudio.com/docs/copilot/customization/mcp-servers"
read = 2026-11-14
mark = "unverified"
note = "The page names the user profile's configuration, not its path: VS Code's user folder per platform."
register = '''code --add-mcp '{"name":"se","command":"bash","args":["'"{launcher}"'","--root","${workspaceFolder}"]}' '''
register_windows = '''code --add-mcp (@{name='se';command='powershell';args=@('-NoProfile','-ExecutionPolicy','Bypass','-File',"{launcher_ps1}",'--root','${workspaceFolder}')} | ConvertTo-Json -Compress).Replace('"','\"')'''
