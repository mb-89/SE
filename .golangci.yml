# golangci-lint lints and formats the Go code; tests/check.sh runs it.
version: "2"
run:
  # Parallel checks on one box (several worktrees, one container) share
  # golangci-lint's lock: a second run waits for it rather than failing.
  allow-serial-runners: true
linters:
  default: none
  enable: [govet, staticcheck, errcheck, ineffassign, unused]
  settings:
    errcheck:
      # Closing, removing and writing to stderr are best effort: their error has nowhere to go.
      exclude-functions:
        - (io.Closer).Close
        - (*os.File).Close
        - (net.Listener).Close
        - os.Remove
        - os.RemoveAll
        - fmt.Fprintf
        - fmt.Fprintln
        - io.WriteString
formatters:
  enable: [gofumpt]
