# The wiring file: the module instances and the wires that bind their ports.
# It is the only place that knows the global layout; spec/index.md says what
# an entry may say. The se binary embeds it, and reads config values from it.
instances:
  clock: {module: clock}
  session: {module: session}
  sessionlog: {module: sessionlog}
  cli: {module: cli}
  guidance: {module: guidance, config: {inline: true, principles: true}}
  github: {module: github, config: {refresh: 2m, settle: 5m}}
wires:
  session.events: session/events
  sessionlog.events: session/events
