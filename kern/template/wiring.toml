# The application's instances and wires (kern's docs/go-core.md "Switching components on and off").
# The bare application has none; the core starts on it with only its own names. An instance of one
# of kern's shared components, or of the application's own, and the wires its inputs read:
#
#   [instances.<name>]
#   component = "<component>"
#   enabled = false        # switched off: its names read their built-in values, its wires stay
#
#   [wires]
#   "<instance>.<input>" = "<instance>/<output>"
#   "<instance>.<input>" = { to = "<instance>/<output>", builtin = true }   # may go without it
#
# The core refuses to start where a switched-on instance reads a switched-off one's output without
# builtin = true, naming the wire's line and the switch's line.
