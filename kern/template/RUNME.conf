# This application's declaration for the generic RUNME; RUNME.sh's header owns the format.
need git command git
get git winget Git.Git
get git apt git
get git dnf git
get git brew git
need go command go
get go winget GoLang.Go
get go apt golang-go
get go dnf golang
get go brew go
need app file app
get app any go build ./cmd/app
run "$RUNME_ROOT/app"
