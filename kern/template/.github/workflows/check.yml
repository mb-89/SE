# The application's CI, the check its main's ruleset requires: kern's battery, the Go and Python
# tests within se.toml [tests]'s budget (kern's README "The battery"). It calls the battery's copy
# that `se new app` writes beside it at kern's pin (SE's README "Workflows").
name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/kern-battery.yml
