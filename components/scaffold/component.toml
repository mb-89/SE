# Generated by `work_tickets.py docs` from se.py's parser; change a command there.
name = "scaffold"
contract = 1
help = "What SE scaffolds: a new application on kern, and an ad hoc component in a checkout."

[commands."se.py new app"]
usage = "se.py new app --path PATH name"
summary = "create an application on kern from kern's template at SE's kern pin"
group = "Scaffold"
help = "create an application on kern from kern's template at SE's kern pin"
class = "batch"

[commands."se.py component add"]
usage = "se.py component add [--root ROOT] name"
summary = "scaffold an ad hoc component under the ignored .se/components/"
group = "Scaffold"
help = "scaffold an ad hoc component under the ignored .se/components/"
class = "batch"
