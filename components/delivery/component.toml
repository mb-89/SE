# Generated by `work_tickets.py docs` from its command registry; change a command there.
name = "delivery"
contract = 1
help = "A worker's delivery: the field report and its guard, sync and identity, the gated push and the pull request, and the Stop hook's check."

[commands."work_tickets.py field-report"]
usage = "work_tickets.py field-report [--worktree WORKTREE] (--draft FILE | --check FILE)\n                             [--issue-body FILE] [--comment-count N] [--newest-comment ID]\n                             [--check-runs FILE]"
summary = "draft or check the field report a pull request description carries, ..."
group = "Delivery"
help = "draft or check the field report a pull request description carries, in the form of .github/pull_request_template.md"
class = "batch"

[commands."work_tickets.py guard"]
usage = "work_tickets.py guard --worktree WORKTREE --branch BRANCH --pr-description FILE"
summary = "require the field report to name removed protected content, against ..."
group = "Delivery"
help = "require the field report to name removed protected content, against origin/<integration branch> as sync fetched it (the local branch without origin)"
class = "batch"

[commands."work_tickets.py sync"]
usage = "work_tickets.py sync --worktree WORKTREE"
summary = "merge the newest integration branch (se.toml ..."
group = "Delivery"
help = "merge the newest integration branch (se.toml project.integration_branch, default main) from origin, or locally without origin"
class = "batch"

[commands."work_tickets.py identity"]
usage = "work_tickets.py identity --worktree WORKTREE"
summary = "set the checkout's commit identity (machine-local public_identity, ..."
group = "Delivery"
help = "set the checkout's commit identity (machine-local public_identity, else se.toml project.identity) as sync does, without fetching or merging; scripts/setup.sh and setup.ps1 run it"
class = "batch"

[commands."work_tickets.py deliver"]
usage = "work_tickets.py deliver --worktree WORKTREE [--integrator-session INTEGRATOR_SESSION]"
summary = "sync, check the field report, push, and create or update the pull ..."
group = "Delivery"
help = "sync, check the field report, push, and create or update the pull request whose description carries it; files no issue"
class = "batch"

[commands."work_tickets.py push"]
usage = "work_tickets.py push [--worktree WORKTREE] [branch]"
summary = "public check's push gate, then git push -u origin <branch>"
group = "Delivery"
help = "public check's push gate, then git push -u origin <branch>; retries a transient refusal once a minute, ten attempts; the integration branch needs a passing suite and public check recorded on the tree pushed"
class = "batch"

[commands."work_tickets.py verified"]
usage = "work_tickets.py verified [--worktree WORKTREE] remote_ref commit"
summary = "the pre-push hook's guard: refuse a push of <commit> to <remote ref> ..."
group = "Delivery"
help = "the pre-push hook's guard: refuse a push of <commit> to <remote ref> where the ref is the integration branch and no passing suite and public check are recorded on its tree; push runs the same check"
class = "batch"

[commands."work_tickets.py pr-body"]
usage = "work_tickets.py pr-body [--worktree WORKTREE] --issue-body ISSUE_BODY --issue-url ISSUE_URL\n                        --field-report FILE"
summary = "print the pull request description deliver writes: Fixes <issue> ..."
group = "Delivery"
help = "print the pull request description deliver writes: Fixes <issue> where all its acceptance shows before the merge, else Refs <issue>, then the field report between its markers"
class = "batch"

[commands."work_tickets.py stop-check"]
usage = "work_tickets.py stop-check [--worktree WORKTREE] [--pull NUMBER] [--pr-description FILE]\n                           [--hook JSON]"
summary = "the plugin's Stop and SubagentStop hook: in a checkout whose ticket ..."
group = "Delivery"
help = "the plugin's Stop and SubagentStop hook: in a checkout whose ticket queue is for a work issue, refuse the turn's end while its branch has no open pull request whose description carries a field report that passes field-report --check at the branch tip, naming what is missing and the commands; at most [stop] refusals times in a row (se.toml, built in 5). Anywhere else, for a sub-agent that is no worker, and where it cannot judge (no gh and no recorded pull request) it lets the turn end. It reads the hook's JSON on stdin and answers the hook's JSON on stdout"
class = "batch"
