summary = "write an overhaul's draft"
group = "Overhaul"
help = "write an overhaul's draft"
class = "batch"

[commands."overhaul.py file"]
usage = "overhaul.py file --draft FILE [--worktree WORKTREE] [--repo REPO] overhaul"
summary = "check a judged overhaul draft and close the overhaul issue with its ..."
group = "Overhaul"
help = "check a judged overhaul draft and close the overhaul issue with its report"
class = "batch"

[commands."overhaul.py facts"]
usage = "overhaul.py facts [--repo REPO] [--json]"
