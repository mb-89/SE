# Generated by `work_tickets.py docs` from its command registry; change a command there.
name = "tickets"
contract = 1
help = "The worker's local ticket queue under .se/work: tickets, notes, discovery evidence and the worktree's close."

[commands."work_tickets.py init"]
usage = "work_tickets.py init --worktree WORKTREE"
summary = "initialize the ticket queue"
group = "Tickets"
help = "initialize the ticket queue"
class = "batch"

[commands."work_tickets.py create"]
usage = "work_tickets.py create --worktree WORKTREE --id ID --title TITLE [--acceptance ACCEPTANCE]"
summary = "create a ticket in todo"
group = "Tickets"
help = "create a ticket in todo"
class = "batch"

[commands."work_tickets.py move"]
usage = "work_tickets.py move --worktree WORKTREE --id ID --to {todo,held,done} [--issue-body FILE]"
summary = "move a ticket between states"
group = "Tickets"
help = "move a ticket between states"
class = "batch"

[commands."work_tickets.py status"]
usage = "work_tickets.py status --worktree WORKTREE [--json] [--integration-target INTEGRATION_TARGET]"
summary = "report queue status"
group = "Tickets"
help = "report queue status"
class = "interactive"
read-only = true
mcp = "Reports the local ticket queue of a worker's worktree (--worktree): the tickets todo, held and done. Use it before and after each ticket to see what remains."

[commands."work_tickets.py review-note"]
usage = "work_tickets.py review-note --worktree WORKTREE --note NOTE --disposition DISPOSITION\n                            [--backlog-ref BACKLOG_REF]"
summary = "append a local note disposition"
group = "Tickets"
help = "append a local note disposition"
class = "batch"

[commands."work_tickets.py probe"]
usage = "work_tickets.py probe --worktree WORKTREE --command PROBE_COMMAND --output OUTPUT"
summary = "append a command and output path to the discovery evidence index"
group = "Tickets"
help = "append a command and output path to the discovery evidence index"
class = "batch"

[commands."work_tickets.py close"]
usage = "work_tickets.py close --worktree WORKTREE [--integration-target INTEGRATION_TARGET]\n                      [--remove] [--json]"
summary = "check or close an integrated worktree"
group = "Tickets"
help = "check or close an integrated worktree"
class = "batch"
