# Generated by `work_tickets.py docs` from review.py's parser; change a command there.
name = "review"
contract = 1
help = "A cold review of a delivered pull request: the brief a reviewer starts from, and the report it files as one comment."

[commands."review.py brief"]
usage = "review.py brief [--claims] [--json] [--worktree WORKTREE] [--repo REPO] [--pull FILE]\n                [--issue FILE] [--issue-comments FILE] [--checks FILE] [--pull-comments FILE]\n                pull_request"
summary = "what a cold reviewer of a delivered pull request starts from"
group = "Review"
help = "what a cold reviewer of a delivered pull request starts from"
class = "batch"

[commands."review.py file"]
usage = "review.py file --report FILE [--pull FILE] [--issue FILE] [--worktree WORKTREE] [--repo REPO]\n               pull_request"
summary = "check a review report and post it as one comment on the pull request"
group = "Review"
help = "check a review report and post it as one comment on the pull request"
class = "batch"
