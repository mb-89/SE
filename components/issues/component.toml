# Generated by `work_tickets.py docs` from its command registry; change a command there.
name = "issues"
contract = 1
help = "Work issues and their comments as a role reads and files them: intake, refresh, escalation, filing, routing, the backlog, blockers and the fleet's pause."

[commands."work_tickets.py intake"]
usage = "work_tickets.py intake --worktree WORKTREE (--issue ISSUE | --issue-body FILE | --outside)\n                       [--comments-file FILE] [--repo REPO] [--discovery]\n                       [--probe-root PROBE_ROOT]"
summary = "read the work issue with gh, or from the files your GitHub tools' ..."
group = "Issues"
help = "read the work issue with gh, or from the files your GitHub tools' answers were saved to, and write its tickets into todo"
class = "batch"

[commands."work_tickets.py refresh"]
usage = "work_tickets.py refresh --worktree WORKTREE [--issue ISSUE] [--repo REPO] [--json]"
summary = "re-read the work issue and its comments and report changes"
group = "Issues"
help = "re-read the work issue and its comments and report changes"
class = "batch"

[commands."work_tickets.py comments-read"]
usage = "work_tickets.py comments-read --worktree WORKTREE --count COUNT --newest NEWEST"
summary = "record the work issue's comments as read: their count and the newest ..."
group = "Issues"
help = "record the work issue's comments as read: their count and the newest one's id (intake records them; field-report --check and deliver refuse comments after it)"
class = "batch"

[commands."work_tickets.py body-read"]
usage = "work_tickets.py body-read --worktree WORKTREE [--body-file FILE]"
summary = "record the work issue's body as read (intake records it"
group = "Issues"
help = "record the work issue's body as read (intake records it; field-report --check and deliver refuse a body changed after it)"
class = "batch"

[commands."work_tickets.py escalate"]
usage = "work_tickets.py escalate --worktree WORKTREE --issue ISSUE --file FILE [--repo REPO]"
summary = "comment a question on an issue and label it escalated"
group = "Issues"
help = "comment a question on an issue and label it escalated"
class = "batch"

[commands."work_tickets.py file"]
usage = "work_tickets.py file --worktree WORKTREE --title TITLE --body-file BODY_FILE [--blocked-by N]\n                     [--label LABEL] [--repo REPO]"
summary = "for SE: file a work issue labelled work, ready and repo:<name>"
group = "Issues"
help = "for SE: file a work issue labelled work, ready and repo:<name>; with --blocked-by, ready only once its blockers are linked"
class = "batch"

[commands."work_tickets.py route"]
usage = "work_tickets.py route --worktree WORKTREE [--title TITLE] [--type TYPE]\n                      --routing-file ROUTING_FILE [--issue-title ISSUE_TITLE]\n                      [--issue-body ISSUE_BODY] [--repo REPO]\n                      issue"
summary = "for SE: route a checked outside issue as a work issue in one edit: ..."
group = "Issues"
help = "for SE: route a checked outside issue as a work issue in one edit: retitle it to its branch name, label it work, ready and repo:<name>, and append the routing section with the handled record to its body"
class = "batch"

[commands."work_tickets.py backlog file"]
usage = "work_tickets.py backlog file --worktree WORKTREE --title TITLE --body-file BODY_FILE\n                             [--repo REPO]"
summary = "file one backlog issue with both labels, creating backlogged where ..."
group = "Issues"
help = "file one backlog issue with both labels, creating backlogged where missing"
class = "batch"

[commands."work_tickets.py backlog list"]
usage = "work_tickets.py backlog list --worktree WORKTREE [--search SEARCH] [--repo REPO]"
summary = "list the open backlog issues, or those whose title or body matches ..."
group = "Issues"
help = "list the open backlog issues, or those whose title or body matches --search"
class = "batch"

[commands."work_tickets.py block"]
usage = "work_tickets.py block --worktree WORKTREE --by BLOCKER [--repo REPO] issue"
summary = "link an issue to a native blocker"
group = "Issues"
help = "link an issue to a native blocker"
class = "batch"

[commands."work_tickets.py paused"]
usage = "work_tickets.py paused [--worktree WORKTREE] [--repo REPO]"
summary = "whether the fleet is paused: exit code 1 and the issue while an ..."
group = "Issues"
help = "whether the fleet is paused: exit code 1 and the issue while an issue labelled pause is open in the repository (the owner's switch; closing it resumes), exit code 0 while none is. queue, start, integrate and route refuse while paused. Without gh it prints the search as a plan for the session's GitHub tools, exit code 2"
class = "batch"
