# SE's own binary: kern's core plus SE's Go components (components/README.md), the binary `se`
# (cmd/se). This file owns the se binary's version and the path its release is published under,
# read by the release tool (kern/tools/release) and by scripts/se_modules.py `app-binary`, which
# bootstrap.sh reads to fetch, build and start it (SE's docs/go-core.md "How the binary arrives").
# The path lies under the home the checkout's origin names (scripts/se_home.py, kern's home), so it
# names no host, owner or repository; without one, the start builds the binary from this folder.
#
# The tag scheme is se-v<version>, distinct from SE's own v<version> release tags (release.yml), so
# the two never collide; kern's v<version> tags are its own repository's.
version = "0.10.0"
download = "releases/download/se-v{version}"
# The binary and its package, which make this a release the tool builds for SE's own binary rather
# than the bare core's; the package is relative to this folder.
binary = "se"
package = "./cmd/se"
