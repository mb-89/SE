# Generated by `work_tickets.py docs` from se_guidance.py's parser; change a command there.
name = "guidance"
contract = 1
help = "SE's guidance: collect resolves the guidance trees of the project and its modules for a template or a set of tags, general before specific; project writes the tool files the notes implement; and check finds what docs/guidance.md refuses in them."

[commands."se_guidance.py collect"]
usage = "se_guidance.py collect (--template TEMPLATE | --tags TAGS) [--json] [--session SESSION]\n                       [--page PAGE] [--root ROOT]"
summary = "print the guidance a template or a set of tags gets, general first"
group = "Guidance"
help = "print the guidance a template or a set of tags gets, general first"
class = "interactive"
read-only = true
mcp = "Gives the guidance notes a template (--template) or a topic's tags (--tags a,b) get, general before specific, once per session (--session) and in pages. Use it before you work on or talk about a topic, and for a template's guidance before its input."

[commands."se_guidance.py check"]
usage = "se_guidance.py check [--root ROOT]"
summary = "find what docs/guidance.md refuses in the guidance trees"
group = "Guidance"
help = "find what docs/guidance.md refuses in the guidance trees"
class = "interactive"
read-only = true
mcp = "Finds what docs/guidance.md refuses in the project's guidance trees: front matter, names, tags, orphans, overrides, size and the generated files. Use it after changing a note."

[commands."se_guidance.py project"]
usage = "se_guidance.py project [--root ROOT]"
summary = "write each tool file the notes implement, its generated part from them"
group = "Guidance"
help = "write each tool file the notes implement, its generated part from them"
class = "batch"
