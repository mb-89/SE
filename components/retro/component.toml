# Generated by `work_tickets.py docs` from retro.py's parser; change a command there.
name = "retro"
contract = 1
help = "A retro: collect writes its draft from the work since the last one, file checks the judged draft and closes the retro issue with its report."

[commands."retro.py collect"]
usage = "retro.py collect [--since DATE | --retro ISSUE] [--out FILE] [--json] [--answers DIR]\n                 [--worktree WORKTREE] [--repo REPO]\n                 retro"
summary = "read a retro's window from GitHub and write its draft"
group = "Retro"
help = "read a retro's window from GitHub and write its draft"
class = "batch"

[commands."retro.py file"]
usage = "retro.py file --draft FILE [--worktree WORKTREE] [--repo REPO] retro"
summary = "check a judged retro draft and close the retro issue with its report"
group = "Retro"
help = "check a judged retro draft and close the retro issue with its report"
class = "batch"
