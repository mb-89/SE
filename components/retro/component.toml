# Generated by `work_tickets.py docs` from retro.py's parser; change a command there.
name = "retro"
contract = 1
help = "A retro: collect writes its draft from the work since the last one, file checks the judged draft and closes the retro issue with its report, due says whether a retro or an overhaul is due or open."

[commands."retro.py collect"]
usage = "retro.py collect [--since DATE | --retro ISSUE] [--out FILE] [--json]\n                 [--signals FILE [FILE ...]] [--refusals] [--sessions FILE] [--answers DIR]\n                 [--worktree WORKTREE] [--repo REPO]\n                 retro"
summary = "read a retro's window from GitHub and write its draft"
group = "Retro"
help = "read a retro's window from GitHub and write its draft"
class = "batch"

[commands."retro.py file"]
usage = "retro.py file --draft FILE [--worktree WORKTREE] [--repo REPO] retro"
summary = "check a judged retro draft and close the retro issue with its report"
group = "Retro"
help = "check a judged retro draft and close the retro issue with its report"
class = "batch"

[commands."retro.py due"]
usage = "retro.py due [--json] [--answers DIR] [--worktree WORKTREE] [--repo REPO]"
summary = "say whether a retro or an overhaul is due or open"
group = "Retro"
help = "say whether a retro or an overhaul is due or open"
class = "batch"
