# SE's wiring: kern's GitHub component, and SE's fleet, retro and origin components reading it
# (README.md beside this file). The core that carries them is the se binary, cmd/se.
# The config is SE's own checkout's: se.toml [fleet] lease_hours and [retro] due_after, the
# repository name, the tracker and the integration branch.

[instances.github]
component = "github"

[instances.origin]
component = "origin"

[instances.fleet]
component = "fleet"
config = { lease-hours = 3.0, repository = "SE", base = "main" }

[instances.retro]
component = "retro"
config = { due-after = 10, tracker = "mb-89/SE", base = "main" }

[wires]
"github.issues" = "github/issues/<key>"
"github.pulls" = "github/pulls/<key>"
"github.checks" = "github/checks/<key>"
"github.outbox" = "github/outbox/<key>"
"fleet.issues" = "github/issues/<key>"
"fleet.pulls" = "github/pulls/<key>"
"fleet.checks" = "github/checks/<key>"
"fleet.branches" = "origin/branches"
"retro.issues" = "github/issues/<key>"
"retro.pulls" = "github/pulls/<key>"
