# Generated by `work_tickets.py docs` from its command registry; change a command there.
name = "integration"
contract = 1
help = "The integrator's and SE's work: integrate and its release, ref maintenance, the suite and its budget, metrics, settings, starting work, the queue, the fleet and settings checks and the generated docs."

[commands."work_tickets.py integrate"]
usage = "work_tickets.py integrate --worktree WORKTREE [--repo REPO] [--pr-description FILE]\n                          [--issue-body FILE] [--branch BRANCH] [--read-back BRANCH]\n                          [--landing-pull LANDING_PULL] [--check-run CHECK_RUN]\n                          [--landing-description FILE] [--build-command BUILD_COMMAND]\n                          [--include-late REASON] [--check-command JSON]\n                          [--check-command-temporary-directory]\n                          [pull_request]"
summary = "validate the field report a pull request's description carries, ..."
group = "Integration"
help = "validate the field report a pull request's description carries, merge it on land/<branch>, test, land it through a squash pull request once check passes, and close the work issue. Where gh is not signed in it pushes land/<branch> and prints the GitHub steps as a plan for the session's GitHub tools; --read-back <branch> then checks the landing through git and finishes the close-out"
class = "batch"

[commands."work_tickets.py release-trailer"]
usage = "work_tickets.py release-trailer [--worktree WORKTREE] --issue-body ISSUE_BODY\n                                [--pr-description FILE] [--include-late REASON]\n                                branch"
summary = "print the Release-kind trailer an integration merge of <branch> ..."
group = "Integration"
help = "print the Release-kind trailer an integration merge of <branch> carries, from its field report's Release kind (a re-integration's from its Re-integration kind); push requires it"
class = "batch"

[commands."work_tickets.py component-kinds"]
usage = "work_tickets.py component-kinds FILE"
summary = "print the release guard's $SE_COMPONENT_KINDS line from the field ..."
group = "Integration"
help = "print the release guard's $SE_COMPONENT_KINDS line from the field report in FILE, for CI's environment (README \"Component versions\")"
class = "batch"

[commands."work_tickets.py refs request"]
usage = "work_tickets.py refs request --worktree WORKTREE --triples-file TRIPLES_FILE [--repo REPO]\n                             [--read-back] [--request-id REQUEST_ID] [--run-url RUN_URL]\n                             [--conclusion CONCLUSION] [--log-file LOG_FILE]\n                             issue"
summary = "for the integrator: post the triples on the issue, run ref- ..."
group = "Integration"
help = "for the integrator: post the triples on the issue, run ref-maintenance's dry run, post its output and label the issue escalated; prints the line for SE. Where gh is not signed in it prints these GitHub steps as a plan for the session's GitHub tools; --read-back then checks the refs and finishes"
class = "batch"

[commands."work_tickets.py refs apply"]
usage = "work_tickets.py refs apply --worktree WORKTREE [--repo REPO] [--comments-file COMMENTS_FILE]\n                           [--read-back] [--run-url RUN_URL] [--conclusion CONCLUSION]\n                           issue"
summary = "for SE, on the person's yes: run ref-maintenance for real with the ..."
group = "Integration"
help = "for SE, on the person's yes: run ref-maintenance for real with the triples the issue's newest request posted, read the refs back and post the result; prints the line for the integrator. Where gh is not signed in it prints these GitHub steps as a plan for the session's GitHub tools; --read-back then checks the refs and finishes"
class = "batch"

[commands."work_tickets.py suite"]
usage = "work_tickets.py suite --worktree WORKTREE [--slowest N] [--compare REF] [--runs N]"
summary = "run se.toml's complete suite against its [tests] time budget, as ..."
group = "Integration"
help = "run se.toml's complete suite against its [tests] time budget, as integrate does; exit code 1 when tests fail, 3 when they pass over the limit and the budget refuses them (README \"Test budget\")"
class = "batch"

[commands."work_tickets.py suite-shard"]
usage = "work_tickets.py suite-shard --worktree WORKTREE --name NAME --record DIR ..."
summary = "on CI, run one shard of a sharded suite, the COMMAND after --, show ..."
group = "Integration"
help = "on CI, run one shard of a sharded suite, the COMMAND after --, show its output, time it and write its record DIR/NAME.json for suite-time; exit code the command's (README \"Test budget\")"
class = "batch"

[commands."work_tickets.py suite-time"]
usage = "work_tickets.py suite-time --worktree WORKTREE --shards DIR [--expect N]"
summary = "in CI's check job, judge a sharded suite: its time is its slowest ..."
group = "Integration"
help = "in CI's check job, judge a sharded suite: its time is its slowest shard's, from the records suite-shard wrote; prints it as the notice CI's suite time is read from, and no time when a shard failed; refusals and warnings are workflow annotations; exit code 1 when a shard failed or is missing, 3 when the time is over the limit and the budget refuses it (README \"Test budget\")"
class = "batch"

[commands."work_tickets.py metrics"]
usage = "work_tickets.py metrics [--since DATE] [--file FILE]"
summary = "print what the commands cost, from the line every run of a command ..."
group = "Integration"
help = "print what the commands cost, from the line every run of a command appends (README Metrics): top spenders by total wall time and by GitHub calls, and each overrun of a declared budget (the suite's [tests] limit_seconds in se.toml)"
class = "interactive"

[commands."work_tickets.py config"]
usage = "work_tickets.py config --worktree WORKTREE [--repo REPO] [--worktree-root WORKTREE_ROOT]\n                       [--integrator-session INTEGRATOR_SESSION]"
summary = "show the repository and the machine-local settings in effect"
group = "Integration"
help = "show the repository and the machine-local settings in effect"
class = "interactive"

[commands."work_tickets.py start"]
usage = "work_tickets.py start --worktree WORKTREE [--repo REPO] [--worktree-root WORKTREE_ROOT]\n                      [--no-create] [--cloud-agent CLOUD_AGENT]\n                      issue"
summary = "start a ready work issue: worktree from the newest main, label in- ..."
group = "Integration"
help = "start a ready work issue: worktree from the newest main, label in-progress"
class = "batch"

[commands."work_tickets.py ready"]
usage = "work_tickets.py ready [--worktree WORKTREE] [--repo REPO] [--all-repos]"
summary = "list startable ready work issues"
group = "Integration"
help = "list startable ready work issues"
class = "interactive"

[commands."work_tickets.py capacity"]
usage = "work_tickets.py capacity [--worktree WORKTREE] [--repo REPO] [--all-repos]"
summary = "show local worker capacity or cloud unlimited capacity"
group = "Integration"
help = "show local worker capacity or cloud unlimited capacity"
class = "interactive"

[commands."work_tickets.py queue"]
usage = "work_tickets.py queue [--worktree WORKTREE] [--repo REPO] [--all-repos]"
summary = "list delivered pull requests (open, to the integration branch, with ..."
group = "Integration"
help = "list delivered pull requests (open, to the integration branch, with a complete field report), escalations and startable work issues"
class = "interactive"

[commands."work_tickets.py fleet-check"]
usage = "work_tickets.py fleet-check [--worktree WORKTREE] [--repo REPO] [--json]\n                            [--open-issues OPEN_ISSUES] [--closed-issues CLOSED_ISSUES]\n                            [--pulls PULLS]"
summary = "list every stuck or stray piece of work, each with its issue, pull ..."
group = "Integration"
help = "list every stuck or stray piece of work, each with its issue, pull request and remedy: in-progress work without a branch once the lease has passed since its Started comment (listed as starting before) or without a push within the lease, a delivered pull request whose check failed or that conflicts, a branch of a closed issue, a block by an issue closed as not planned or by itself, an se-person issue and what it holds up; 'healthy' and exit code 0 when there is none, exit code 1 otherwise. It only reads. Without gh it prints its GitHub plan and takes the answers from files"
class = "interactive"

[commands."work_tickets.py settings-check"]
usage = "work_tickets.py settings-check [--worktree WORKTREE] [--repo REPO] [--ruleset FILE]\n                               [--scheduled-tasks FILE] [--environment FILE] [--strict]"
summary = "compare the fleet's settings the repository records ..."
group = "Integration"
help = "compare the fleet's settings the repository records (fleet/settings.toml) with the live ones, each difference in one line: main's ruleset through gh where it is signed in or from --ruleset, the scheduled tasks and the cloud environment from the answers of the session's list_triggers and get_environment tools; a part whose door is missing and a value recorded as unchecked are reported unchecked, never as a difference. Advisory: exit code 0 whatever it finds, 1 for a difference only with --strict. It only reads"
class = "interactive"

[commands."work_tickets.py docs"]
usage = "work_tickets.py docs [--check]"
summary = "write the command groups' component declarations ..."
group = "Integration"
help = "write the command groups' component declarations (components/<group>/component.toml) from this registry and the README's command reference from them; with --check, only refuse a declaration or a README that differs"
class = "batch"

[commands."work_tickets.py format"]
usage = "work_tickets.py format [--root ROOT]"
summary = "apply the fix of every check the check job runs that a fix can ..."
group = "Integration"
help = "apply the fix of every check the check job runs that a fix can satisfy: write the generated layouts (se_plugin.py build) and the command reference with its declarations (docs); a second run writes nothing"
class = "batch"

[requests.step]
type = "github.step"
answer = "github.step-answer"
help = "One GitHub step of a streamed command through kern's relay: the tool and the input the session runs, answered with the tool's answer."
