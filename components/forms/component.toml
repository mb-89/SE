# Generated by `work_tickets.py docs` from se_forms.py's parser; change a command there.
name = "forms"
contract = 1
help = "SE's forms: list names them, draft gives a form's fields, their instructions and their shape, and check finds everything SE's filing commands would refuse in a text, or gives the Markdown to file."

[commands."se_forms.py list"]
usage = "se_forms.py list [--tree]"
summary = "name every form with its actions"
group = "Forms"
help = "name every form with its actions"
class = "interactive"
read-only = true
mcp = "Lists SE's forms with the actions each shapes. Use it to find the form for a text before writing it."

[commands."se_forms.py draft"]
usage = "se_forms.py draft [--markdown] [--tree] form"
summary = "print a form's fields, their instructions, their shape and its schema"
group = "Forms"
help = "print a form's fields, their instructions, their shape and its schema"
class = "interactive"
read-only = true
mcp = "Gives a form's fields, what belongs in each (field_says), their shape and a JSON Schema of them. Use it before writing an issue, a pull request or a report SE checks."

[commands."se_forms.py check"]
usage = "se_forms.py check (--body-file BODY_FILE | --fields FIELDS | --body BODY |\n                  --fields-json FIELDS_JSON) [--title TITLE] [--render] [--action ACTION]\n                  [--repo REPO] [--labels LABELS] [--base BASE] [--worktree WORKTREE]\n                  [--tree]\n                  [form]"
summary = "check a text against a form as SE's filing commands would"
group = "Forms"
help = "check a text against a form as SE's filing commands would"
class = "interactive"
read-only = true
mcp = "Checks a text or a fields object against a form as SE's filing commands would: its first line is passes or refused, then every finding or, with --render, the Markdown to file. Use it before filing; it files nothing."

[commands."se_forms.py gate"]
usage = "se_forms.py gate [--gate {off,warn,refuse}]"
summary = "SE's hook: judge one GitHub write's body against its form"
group = "Forms"
help = "SE's hook: judge one GitHub write's body against its form"
class = "batch"
