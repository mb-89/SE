# Generated by `work_tickets.py docs` from timeline.py's parser and deck.py's parser; change a command there.
name = "render"
contract = 1
help = "The pages SE renders: timeline.py builds the Timeline from GitHub, deck.py builds a deck of decisions, serves it and reads its answers."

[commands."timeline.py"]
usage = "timeline.py --destination DESTINATION [--snapshot SNAPSHOT] [--save-snapshot SAVE_SNAPSHOT]\n            [--config CONFIG]"
summary = "Build the Timeline: one static HTML page of the repositories in ..."
group = "Render"
help = "Build the Timeline: one static HTML page of the repositories in se.toml `[timeline]`."
class = "batch"

[commands."deck.py build"]
usage = "deck.py build --destination DESTINATION folder"
summary = "build a folder of decision notes into one deck"
group = "Render"
help = "build a folder of decision notes into one deck"
class = "batch"

[commands."deck.py serve"]
usage = "deck.py serve [--wait] [--timeout S] artifact"
summary = "serve a deck locally and print the answers it is sent"
group = "Render"
help = "serve a deck locally and print the answers it is sent"
class = "batch"

[commands."deck.py answers"]
usage = "deck.py answers [--record FOLDER] [--destination DESTINATION] answers"
summary = "print what the answers ask the agent to act on"
group = "Render"
help = "print what the answers ask the agent to act on"
class = "batch"
