# A routed outside issue: only the routing block `route` appends after the handled marker is
# checked; everything above it is the outside author's data. scripts/forms.py's docstring owns
# this file's format.
name = "routed"
reader = "fleet"
says = "The routing block SE appends to an outside issue: where it came from and what it lacks."
keep_unknown = true

[applies]
actions = ["issue.create", "issue.edit"]
order = 10
marker = "<!-- se:handled -->"

[scope]
after = "<!-- se:handled -->"
section = "Routing"
level = 3

[rules]
required = "refuse"
choice = "refuse"
duplicate = "refuse"
dangling = "refuse"
words = "warn"
board = "warn"
unnamed-entry = "warn"

[[fields]]
name = "routed_from"
kind = "line"
label = "Routed from"
required = true
says = "The outside issue's original title."

[[fields]]
name = "goal"
kind = "text"
heading = "Goal"
says = "The outcome, where the outside issue does not say it."

[[fields]]
name = "package_kind"
kind = "choice"
heading = "Package kind"
choices = ["standard", "discovery", "breaking", "patch", "minor", "major",
           "work_tickets:RELEASE_KINDS"]
says = "standard, discovery (read-only research), breaking (a major release), or a kind of work, as `route --type` takes it."

[[fields]]
name = "blocked_by"
kind = "issue"
heading = "Blocked by"
none_ok = true
says = "The issues that must be closed first, one per line, or None."

[[fields]]
name = "user_requirement"
kind = "text"
heading = "User requirement (verbatim)"
verbatim = true
says = "The user's words, quoted exactly."

[[fields]]
name = "design_owner"
kind = "text"
heading = "Design owner"
says = "The files and sections that own the decided behaviour."

[[fields]]
name = "requirements"
kind = "list"
heading = "Requirements"
numbered = true
says = "Numbered, checkable requirements the outside issue lacks."

[[fields]]
name = "acceptance"
kind = "checklist"
heading = "Acceptance"
says = "Checkable items with the evidence expected."

[[fields]]
name = "verification"
kind = "code"
heading = "Verification"
says = "The focused tests and real commands to run."

[example]
title = "feat/outside-idea-20261116"

[example.fields]
routed_from = "Proposal: make the example work"
package_kind = "standard"
requirements = ["The example works."]
acceptance = [{ done = false, text = "A test runs the example." }]
