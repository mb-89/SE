# The owner's ticket schema: a title that is a name under the name rule, then Situation, Problem,
# Goal, Approach, Steps, Check and an optional Depends on. scripts/forms.py's docstring owns this
# file's format.
name = "ticket"
reader = "owner"
says = "An issue the owner reads: what is, what is wrong, what should be, how, and how we know."
actors = ["owner", "SE", "integrator", "worker", "reviewer", "CI", "the person", "everyone"]

[applies]
actions = ["issue.create", "issue.edit"]
order = 30

[rules]
required = "refuse"
choice = "refuse"
not-picked = "refuse"
duplicate = "refuse"
dangling = "refuse"
words = "warn"
actor = "warn"
one-sentence = "warn"
bare-number = "warn"
board = "warn"
terms = "warn"
unnamed-entry = "warn"
title-shape = "warn"

[[fields]]
name = "title"
kind = "line"
source = "title"
required = true
shape = "work_tickets:name_refusal"
says = "The name: 1 to 5 lowercase words joined by dashes, such as `branch-cleanup-on-pr-close`; never repeated in the body."

[[fields]]
name = "situation"
kind = "text"
heading = "Situation"
required = true
max_words = 120
says = "What is true today, as someone who has not followed the work would see it."

[[fields]]
name = "problem"
kind = "text"
heading = "Problem"
required = true
max_words = 120
says = "What goes wrong because of it, and for whom."

[[fields]]
name = "goal"
kind = "text"
heading = "Goal"
required = true
max_words = 120
says = "What is true once this is done, the outcome a person sees."

[[fields]]
name = "approach"
kind = "text"
heading = "Approach"
required = true
max_words = 160
not_picked = true
says = "How it is done, then a line `Not picked:` naming the alternative and why not."

[[fields]]
name = "steps"
kind = "list"
heading = "Steps"
numbered = true
required = true
actor = true
one_sentence = true
says = "The steps in order, one sentence each, each naming who takes it."

[[fields]]
name = "check"
kind = "list"
heading = "Check"
required = true
actor = true
says = "How someone sees that it works, one item per check, each naming who checks."

[[fields]]
name = "depends_on"
kind = "issue"
heading = "Depends on"
none_ok = true
says = "The issues that must be done first, each linked and named, or None."

[example]
title = "plain-issue-titles"

[example.fields]
title = "plain-issue-titles"
situation = "Issues are titled by their branch name."
problem = "The owner cannot tell from the list what an issue changes."
goal = "Every issue title says in plain words what changes."
approach = "SE writes the title from the Goal.\nNot picked: a separate summary field, because the title is what the list shows."
steps = ["SE writes the plain title when it files an issue.", "The worker keeps it."]
check = ["The owner reads the issue list and understands each title."]
depends_on = ["None"]
