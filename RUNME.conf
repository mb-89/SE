# SE's declaration for the generic RUNME: what SE needs on a machine with only its package
# manager, and SE's command line. RUNME.sh's header owns the format.
path ~/.local/bin
path ~/.se/bin
need git command git
get git winget Git.Git
get git apt git
get git dnf git
get git brew git
need curl command curl
get curl apt curl
get curl dnf curl
need bash command bash
get bash apt bash
get bash dnf bash
need claude command claude
get claude unix curl -fsSL https://claude.ai/install.sh | bash
get claude windows powershell -NoProfile -ExecutionPolicy Bypass -Command "irm https://claude.ai/install.ps1 | iex"
need uv command uv
get uv unix curl -LsSf https://astral.sh/uv/install.sh | sh
get uv windows powershell -NoProfile -ExecutionPolicy Bypass -Command "irm https://astral.sh/uv/install.ps1 | iex"
need se file .se/.runtime/runme-se
get se any bash scripts/bootstrap.sh --binary
run se
